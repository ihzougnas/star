<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>連投用100字カウンター</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f5f5f0;
    color: #1a1a1a;
    padding: 20px 16px;
    height: 100vh;
    display: flex;
    justify-content: center;
    overflow: hidden;
  }
  .container {
    width: 100%;
    max-width: 900px;
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  h1 { font-size: 17px; font-weight: 500; margin-bottom: 10px; color: #1a1a1a; flex-shrink: 0; }
  .two-col {
    display: flex;
    gap: 16px;
    align-items: flex-start;
    flex: 1;
    min-height: 0;
  }
  .left-col {
    width: 500px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  .right-col {
    flex: 1;
    min-width: 0;
    height: 100%;
    overflow-y: auto;
  }
  textarea {
    width: 100%;
    flex: 1;
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 15px;
    line-height: 1.7;
    font-family: inherit;
    resize: none;
    background: #fff;
    color: #1a1a1a;
    outline: none;
  }
  textarea:focus { border-color: #888; }
  #status-bar {
    display: flex;
    gap: 12px;
    margin-top: 6px;
    font-size: 13px;
    color: #555;
    flex-shrink: 0;
  }
  #status-bar span { font-weight: 500; color: #1a1a1a; }
  #blocks-info {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-top: 6px;
    flex-shrink: 0;
  }
  .block-pill {
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 99px;
    font-weight: 500;
  }
  .seg-label-row {
    font-size: 12px;
    color: #555;
    margin-bottom: 4px;
  }
  .segment-box {
    border-radius: 8px;
    padding: 6px 10px;
    margin-bottom: 5px;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-all;
    cursor: pointer;
    transition: filter 0.1s;
    display: flex;
    flex-direction: column;
  }
  .segment-box:hover { filter: brightness(0.95); }
  .segment-box:active { filter: brightness(0.88); }
  .seg-header {
    font-size: 11px;
    font-weight: 500;
    margin-bottom: 1px;
  }
  .seg-text {
    line-height: 1.55;
  }
  .copied-toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #1a1a1a;
    color: #fff;
    font-size: 13px;
    padding: 6px 18px;
    border-radius: 99px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .copied-toast.show { opacity: 1; }

  @media (max-width: 700px) {
    body {
      height: auto;
      overflow: auto;
      padding: 16px 12px;
    }
    .container {
      height: auto;
    }
    .two-col {
      flex-direction: column;
    }
    .left-col {
      width: 100%;
      height: auto;
    }
    textarea {
      min-height: 200px;
      flex: none;
      resize: vertical;
    }
    .right-col {
      width: 100%;
      height: auto;
      overflow-y: visible;
    }
  }
</style>
</head>
<body>
<div class="container">
  <h1>連投用100字カウンター</h1>
  <div class="two-col">
    <div class="left-col">
      <textarea id="textarea" placeholder="ここに文章を入力してください…"></textarea>
      <div id="status-bar">
        <div>合計: <span id="total-count">0</span>字</div>
        <div>送信数: <span id="block-count">0</span>通</div>
      </div>
      <div id="blocks-info"></div>
    </div>
    <div class="right-col" id="segments-section"></div>
  </div>
</div>
<div class="copied-toast" id="toast">コピーしました</div>

<script>
const COLORS = [
  { bg: '#dbeafe', text: '#1e40af' },
  { bg: '#dcfce7', text: '#166534' },
  { bg: '#fef9c3', text: '#854d0e' },
  { bg: '#fce7f3', text: '#9d174d' },
  { bg: '#ede9fe', text: '#5b21b6' },
  { bg: '#ffedd5', text: '#9a3412' },
  { bg: '#e0f2fe', text: '#075985' },
];

const textarea = document.getElementById('textarea');
const totalCount = document.getElementById('total-count');
const blockCount = document.getElementById('block-count');
const blocksInfo = document.getElementById('blocks-info');
const segmentsSection = document.getElementById('segments-section');
const toast = document.getElementById('toast');
const chunks = [];
let toastTimer = null;

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1500);
}

function update() {
  const text = textarea.value;
  const len = text.length;
  totalCount.textContent = len;
  chunks.length = 0;

  if (len === 0) {
    blockCount.textContent = 0;
    blocksInfo.innerHTML = '';
    segmentsSection.innerHTML = '';
    return;
  }

  let pos = 0;
  while (pos < text.length) {
    chunks.push(text.slice(pos, pos + 99));
    pos += 99;
  }

  const total = chunks.length;
  blockCount.textContent = total;

  let pillsHtml = '';
  let segsHtml = '';

  for (let i = 0; i < total; i++) {
    const raw = chunks[i];
    const isLast = i === total - 1;
    const display = isLast ? raw : raw + '→';
    const c = COLORS[i % COLORS.length];
    const escaped = display.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const charCount = display.length;

    pillsHtml += `<span class="block-pill" style="background:${c.bg};color:${c.text};">${i+1}通目 (${charCount}字)</span>`;

    segsHtml += `<div class="segment-box" style="background:${c.bg};" onclick="copyBlock(${i})" title="クリックでコピー">
      <div class="seg-header" style="color:${c.text};">${i+1}通目（${charCount}字）— クリックでコピー</div>
      <div class="seg-text" style="color:${c.text};">${escaped}</div>
    </div>`;
  }

  blocksInfo.innerHTML = pillsHtml;
  segmentsSection.innerHTML = segsHtml;
}

function copyBlock(i) {
  const raw = chunks[i];
  const isLast = i === chunks.length - 1;
  const text = isLast ? raw : raw + '→';
  navigator.clipboard.writeText(text).then(() => {
    showToast(`${i+1}通目をコピーしました`);
  });
}

textarea.addEventListener('input', update);
update();
</script>
</body>
</html>
