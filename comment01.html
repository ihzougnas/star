<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ホームコメント記録用ツール</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif;
    background: #f5f5f0;
    color: #1a1a1a;
    padding: 24px 16px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .container { width: 100%; max-width: 520px; min-width: 0; }
  h1 { font-size: 19px; font-weight: 700; text-align: center; }
  .intro {
    font-size: 12px;
    color: #aaa;
    line-height: 1.8;
    text-align: center;
    margin: 6px 0 18px;
  }

  .card {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .card-title { font-size: 13px; font-weight: 700; margin-bottom: 10px; }
  .note { font-size: 12px; color: #888; line-height: 1.8; }
  .note + .note { margin-top: 6px; }

  .bm-wrap { text-align: center; margin: 4px 0 10px; }
  .bm-link {
    display: inline-block;
    padding: 12px 22px;
    border-radius: 10px;
    background: #5BBAF8;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    cursor: grab;
  }
  .bm-link:hover { background: #3aa8f0; }

  .label { font-size: 12px; color: #888; margin: 14px 0 6px; }
  .row { display: flex; gap: 6px; align-items: stretch; }
  textarea, input[type="text"] {
    width: 100%;
    min-width: 0;
    font-family: inherit;
    font-size: 13px;
    padding: 9px 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    color: #1a1a1a;
    background: #fff;
  }
  textarea { font-size: 11.5px; font-family: monospace; resize: vertical; }
  .btn {
    flex-shrink: 0;
    padding: 8px 14px;
    font-size: 12.5px;
    font-weight: 600;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: #fff;
    color: #555;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
  }
  .btn:hover { background: #eee; }
  .btn.primary { background: #5BBAF8; border-color: #5BBAF8; color: #fff; }
  .btn.primary:hover { background: #3aa8f0; }

  .char-form { display: flex; flex-direction: column; gap: 8px; }
  .char-list { margin-top: 12px; }
  .char-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid #f0f0f0;
  }
  .char-item:last-child { border-bottom: none; }
  .char-name { font-size: 13px; font-weight: 700; flex-shrink: 0; max-width: 40%; overflow-wrap: anywhere; }
  .char-url { font-size: 11px; color: #999; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .char-del {
    flex-shrink: 0;
    width: 26px; height: 26px;
    border: 1px solid #e0a0a0; border-radius: 6px;
    background: #fff; color: #c0392b; font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .char-del:hover { background: #ffe8e8; }
  .empty { font-size: 12px; color: #bbb; }
  .status { font-size: 12px; min-height: 16px; margin-top: 6px; overflow-wrap: anywhere; }
  .status.ok { color: #2a8f4f; }
  .status.err { color: #c0392b; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #1a1a1a; color: #fff; font-size: 13px; padding: 7px 18px; border-radius: 99px;
    opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 10;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="container">
  <h1>ホームコメント記録用ツール</h1>
  <div class="intro">
    ホームコメントのコピーを実行できるブックマークレットを作成します。<br>
    ブラウザの制限により、このページから直接実行することはできません。
  </div>

  <div class="card">
    <div class="card-title">ブックマークレット</div>
    <div class="bm-wrap">
      <a class="bm-link" id="bm-link" href="#" draggable="true">📋 ホームコメントをコピー</a>
    </div>
    <div class="note">↑ ブックマークバーにドラッグして登録してください。ログインして任意のページを開いた状態でこのブックマークを選択すると、ホームコメントがコピーされます。</div>
    <div class="note">または、適当なブックマークを作成後編集し、URL欄に下のコードを貼り付けて保存すると同様に実行できます。</div>

    <div class="label">ブックマークレットのコード</div>
    <div class="row">
      <textarea id="bm-code" rows="3" readonly></textarea>
      <button class="btn" id="bm-copy-btn">コピー</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">ステディ・カレ切り替え(任意)</div>
    <div class="note">設定を変えたら、ブックマークを登録し直してください。</div>

    <div class="char-form" style="margin-top:12px;">
      <input type="text" id="char-name" placeholder="名前">
      <input type="text" id="char-url" placeholder="プロフィールページのURLまたはIDを入力">
      <button class="btn primary" id="char-add-btn" style="padding:10px;">追加</button>
      <div class="status" id="char-status"></div>
    </div>
    <div class="char-list" id="char-list"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   ブックマークレットとして埋め込む関数(ゲームのページ上で動く)
   ※この2つの関数は toString() でそのままコード化されるため、
     外部の変数に依存せず、行コメント(//)は使わないこと
   ============================================================ */

/* ホームコメント(<p class="p-action__commentTxt u-txt__l">、スマホ版は u-txt__m)の中身を取り出す。
   <br> は改行に置き換え、ソース上の改行・インデントは表示と同じく詰める。 */
function extractComment(doc) {
  var el = doc.querySelector('p.p-action__commentTxt.u-txt__l, p.p-action__commentTxt.u-txt__m');
  if (!el) { return null; }
  var c = el.cloneNode(true);
  var brs = c.querySelectorAll('br');
  for (var i = 0; i < brs.length; i++) {
    brs[i].parentNode.replaceChild(doc.createTextNode('\u0001'), brs[i]);
  }
  var t = c.textContent.replace(/[ \t\r\n]+/g, ' ');
  t = t.split('\u0001').map(function (s) { return s.replace(/^ +| +$/g, ''); }).join('\n');
  return t.replace(/^[ \n]+|[ \n]+$/g, '');
}

function bookmarkletMain(CFG) {
  var HOME = '/usr/index.php';
  var chars = (CFG && CFG.ch) || [];
  var Z = 2147483647;

  function mk(tag, css, text) {
    var e = document.createElement(tag);
    if (css) { e.style.cssText = css; }
    if (text) { e.textContent = text; }
    return e;
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function preview(t) {
    var s = t.replace(/\n/g, ' ');
    return s.length > 40 ? s.slice(0, 40) + '…' : s;
  }
  function dateHeader() {
    var d = new Date();
    return '-----' + d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }

  function toast(msg, isErr) {
    var old = document.getElementById('__cmt_toast');
    if (old) { old.remove(); }
    var d = mk('div', 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:88%;padding:10px 16px;border-radius:12px;font:13px/1.5 sans-serif;color:#fff;white-space:pre-wrap;z-index:' + Z + ';background:' + (isErr ? '#c0392b' : '#1a1a1a') + ';', msg);
    d.id = '__cmt_toast';
    document.body.appendChild(d);
    setTimeout(function () { d.remove(); }, isErr ? 5000 : 2800);
  }

  async function copy(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) { }
    var ta = mk('textarea', 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;');
    ta.value = text;
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    return ok;
  }

  function showFallback(text) {
    var old = document.getElementById('__cmt_fb');
    if (old) { old.remove(); }
    var w = mk('div', 'position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:88%;max-width:420px;background:#fff;color:#1a1a1a;border-radius:12px;padding:14px;box-shadow:0 6px 24px rgba(0,0,0,.35);font:13px/1.5 sans-serif;z-index:' + Z + ';');
    w.id = '__cmt_fb';
    var ta = mk('textarea', 'width:100%;height:140px;box-sizing:border-box;font:13px/1.5 sans-serif;padding:8px;border:1px solid #ccc;border-radius:8px;');
    ta.value = text;
    var msg = mk('div', 'margin-bottom:8px;color:#c0392b;', '自動でコピーできませんでした。「コピー」を押すか、下の文章を選択してコピーしてください。');
    var row = mk('div', 'display:flex;gap:8px;margin-top:8px;');
    var b1 = mk('button', 'flex:1;padding:9px;border:none;border-radius:8px;background:#5BBAF8;color:#fff;font:600 13px sans-serif;', 'コピー');
    var b2 = mk('button', 'padding:9px 14px;border:1px solid #ccc;border-radius:8px;background:#fff;color:#555;font:13px sans-serif;', '閉じる');
    b1.onclick = async function () {
      var ok = await copy(text);
      b1.textContent = ok ? 'コピーしました' : 'コピーできませんでした';
    };
    b2.onclick = function () { w.remove(); };
    row.appendChild(b1);
    row.appendChild(b2);
    w.appendChild(msg);
    w.appendChild(ta);
    w.appendChild(row);
    document.body.appendChild(w);
    ta.focus();
    ta.select();
  }

  async function fetchDoc(url) {
    var r = await fetch(url, { credentials: 'include', cache: 'no-store' });
    if (!r.ok) { throw new Error('ページを取得できませんでした(HTTP ' + r.status + ')'); }
    var buf = await r.arrayBuffer();
    var cs = (r.headers.get('content-type') || '').match(/charset=([^;\s]+)/i);
    if (!cs) {
      var head = new TextDecoder('latin1').decode(buf.slice(0, 2048));
      cs = head.match(/charset=["']?([\w-]+)/i);
    }
    var html;
    try { html = new TextDecoder(cs ? cs[1] : 'utf-8').decode(buf); } catch (e) { html = new TextDecoder('utf-8').decode(buf); }
    return new DOMParser().parseFromString(html, 'text/html');
  }

  async function getComment(switchUrl) {
    var t;
    if (switchUrl) {
      var r = await fetch(switchUrl, { credentials: 'include', cache: 'no-store' });
      if (!r.ok) { throw new Error('ステディ・カレの切り替えに失敗しました(HTTP ' + r.status + ')'); }
      t = extractComment(await fetchDoc(HOME));
    } else {
      t = extractComment(document);
      if (t === null) { t = extractComment(await fetchDoc(HOME)); }
    }
    if (t === null) { throw new Error('ホームコメントが見つかりません。ログイン状態を確認してください。'); }
    return t;
  }

  async function finish(text, summary) {
    var ok = await copy(text);
    if (ok) { toast('コピーしました\n' + (summary || preview(text))); } else { showFallback(text); }
  }

  async function run(switchUrl) {
    try {
      var t = await getComment(switchUrl);
      await finish(t);
    } catch (e) {
      toast(String((e && e.message) || e), true);
    }
  }

  async function runAll() {
    var cur = '';
    try {
      var out = [];
      for (var i = 0; i < chars.length; i++) {
        cur = chars[i].n;
        toast((i + 1) + '/' + chars.length + ' ' + cur + ' を取得中…');
        var t = await getComment(chars[i].u);
        out.push('【' + cur + '】\n' + t);
        if (i < chars.length - 1) { await sleep(800); }
      }
      await finish(dateHeader() + '\n' + out.join('\n\n') + '\n\n', chars.length + '名分');
    } catch (e) {
      toast((cur ? cur + ':' : '') + String((e && e.message) || e), true);
    }
  }

  function showMenu() {
    var old = document.getElementById('__cmt_menu');
    if (old) { old.remove(); return; }
    var box = mk('div', 'position:fixed;top:12px;right:12px;min-width:220px;max-width:80%;max-height:80vh;overflow:auto;background:#fff;border:1px solid #ccc;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;box-shadow:0 4px 16px rgba(0,0,0,.25);font:13px sans-serif;z-index:' + Z + ';');
    box.id = '__cmt_menu';
    function btn(label, fn, kind) {
      var css = 'padding:9px 12px;border-radius:8px;text-align:left;font:13px sans-serif;border:1px solid #ccc;background:#fff;color:#1a1a1a;';
      if (kind === 'primary') { css = 'padding:9px 12px;border-radius:8px;text-align:left;font:13px sans-serif;border:1px solid #5BBAF8;background:#5BBAF8;color:#fff;'; }
      if (kind === 'strong') { css = 'padding:13px 12px;border-radius:10px;text-align:center;font:700 15px sans-serif;border:2px solid #1a1a1a;background:#1a1a1a;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);'; }
      var b = mk('button', css, label);
      b.onclick = function () { box.remove(); fn(); };
      box.appendChild(b);
    }
    btn('現在のホームコメントをコピー', function () { run(null); }, 'primary');
    btn('全員分をまとめてコピー', function () { runAll(); }, 'strong');
    chars.forEach(function (c) {
      btn(c.n + ' に切り替えてコピー', function () { run(c.u); }, '');
    });
    btn('閉じる', function () { }, '');
    document.body.appendChild(box);
  }

  if (chars.length === 0) { run(null); } else { showMenu(); }
}

/* ============================================================
   このページ側の処理
   ============================================================ */
const CHARS_KEY = 'comment00_chars';
const SWITCH_BASE = 'https://hoshikare.jp/usr/steady/detailSteady.php';
let chars = [];

/* プロフィールページのURL(またはID)から、切り替え用URL(…?sid=〇&myst=1)を作る。
   ※ハートビート音楽院の切り替えは未確認のため未対応 */
function normalizeSwitchUrl(input) {
  const s = String(input || '').normalize('NFKC').trim();
  const bad = { ok: false, msg: 'プロフィールページのURLまたはIDを入力してください。' };
  if (!s) return bad;
  if (/^\d+$/.test(s)) return { ok: true, url: `${SWITCH_BASE}?sid=${s}&myst=1` };

  let u = null;
  try { u = new URL(/^[a-z][a-z0-9+.-]*:\/\//i.test(s) ? s : 'https://' + s); } catch (e) { u = null; }
  if (!u) return bad;
  if (u.hostname === 'heartbeat-academy.com' || u.hostname.endsWith('.heartbeat-academy.com')) {
    return { ok: false, msg: 'ハートビート音楽院の切り替えは未対応です。' };
  }
  if (u.hostname !== 'hoshikare.jp') return bad;
  const sid = u.searchParams.get('sid');
  if (!sid || !/^\d+$/.test(sid)) return bad;
  return { ok: true, url: `${SWITCH_BASE}?sid=${sid}&myst=1` };
}

function loadChars() {
  try {
    const saved = JSON.parse(localStorage.getItem(CHARS_KEY) || '[]');
    chars = Array.isArray(saved) ? saved.filter(c => c && c.n && c.u) : [];
  } catch (e) {
    chars = [];
  }
}
function saveChars() {
  localStorage.setItem(CHARS_KEY, JSON.stringify(chars));
}

let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1500);
}

function buildBookmarklet() {
  const cfg = { ch: chars.map(c => ({ n: c.n, u: c.u })) };
  const body = '(function(){' + extractComment.toString() + ';(' + bookmarkletMain.toString() + ')(' + JSON.stringify(cfg) + ');})();void 0';
  return 'javascript:' + encodeURIComponent(body.replace(/\s*\n\s*/g, ' '));
}

function refreshBookmarklet() {
  const code = buildBookmarklet();
  document.getElementById('bm-link').href = code;
  document.getElementById('bm-code').value = code;
}

function renderChars() {
  const wrap = document.getElementById('char-list');
  if (chars.length === 0) {
    wrap.innerHTML = '<div class="empty">まだ登録されていません。</div>';
    return;
  }
  wrap.innerHTML = chars.map((c, i) => `
    <div class="char-item">
      <span class="char-name"></span>
      <span class="char-url"></span>
      <button type="button" class="char-del" data-i="${i}">✖</button>
    </div>
  `).join('');
  /* 文字列はtextContentで入れる(記号をそのまま安全に表示するため) */
  wrap.querySelectorAll('.char-item').forEach((row, i) => {
    row.querySelector('.char-name').textContent = chars[i].n;
    row.querySelector('.char-url').textContent = chars[i].u;
  });
  wrap.querySelectorAll('.char-del').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = Number(btn.dataset.i);
      if (!confirm(`「${chars[i].n}」を削除します。よろしいですか？`)) return;
      chars.splice(i, 1);
      saveChars();
      renderChars();
      refreshBookmarklet();
    });
  });
}

document.getElementById('char-add-btn').addEventListener('click', () => {
  const nameEl = document.getElementById('char-name');
  const urlEl = document.getElementById('char-url');
  const statusEl = document.getElementById('char-status');
  const n = nameEl.value.trim();
  if (!n) { statusEl.className = 'status err'; statusEl.textContent = '名前を入力してください。'; return; }
  const r = normalizeSwitchUrl(urlEl.value);
  if (!r.ok) { statusEl.className = 'status err'; statusEl.textContent = r.msg; return; }
  chars.push({ n, u: r.url });
  saveChars();
  renderChars();
  refreshBookmarklet();
  nameEl.value = '';
  urlEl.value = '';
  statusEl.className = 'status ok';
  statusEl.textContent = '追加しました。ブックマークを登録し直してください。';
});

document.getElementById('bm-copy-btn').addEventListener('click', () => {
  const text = document.getElementById('bm-code').value;
  navigator.clipboard.writeText(text)
    .then(() => showToast('コードをコピーしました'))
    .catch(() => showToast('コピーできませんでした'));
});

/* このページ上でリンクを押しても動作しない(ゲームのページで実行するもの)ため案内を出す */
document.getElementById('bm-link').addEventListener('click', (e) => {
  e.preventDefault();
  showToast('ブックマークバーにドラッグして登録してください');
});

loadChars();
renderChars();
refreshBookmarklet();
</script>
</body>
</html>
