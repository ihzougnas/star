<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星色/音楽院カレンダー</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif;
    background: #f5f5f0;
    color: #1a1a1a;
    padding: 24px 16px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .container { width: 100%; max-width: 780px; min-width: 0; }
  h1 { font-size: 19px; font-weight: 700; text-align: center; }
  .subtitle { text-align: center; font-size: 12px; color: #aaa; margin-top: 4px; margin-bottom: 16px; }

  /* 表示の切り替え(タブ): 並び順と、記念日・登録/保存・全表示を同じ並びに置く */
  .view-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .view-tab {
    flex: 1 1 auto;
    min-width: 72px;
    padding: 9px 8px;
    font-size: 12.5px;
    font-weight: 600;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: #fff;
    color: #666;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .view-tab:hover { background: #f0f0f0; }
  .view-tab.active { background: #5BBAF8; color: #fff; border-color: #5BBAF8; }

  /* 作品の表示切替(すべてのタブ共通) */
  .filter-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 14px; }
  .filter-btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; font-size: 12px; font-weight: 500;
    border: 1px solid #ccc; border-radius: 8px; background: #fff; color: #666; cursor: pointer;
    font-family: inherit; white-space: nowrap; transition: all 0.15s;
  }
  .filter-mark { display: inline-block; width: 4px; height: 12px; border-radius: 2px; background: var(--work); }
  .filter-btn.active { background: #666; border-color: #666; color: #fff; }
  .filter-btn.active[data-filter="S"], .filter-btn.active[data-filter="H"] { background: var(--work); border-color: var(--work); }
  .filter-btn.active .filter-mark { background: #fff; }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .layout { display: flex; gap: 16px; align-items: flex-start; }
  .col-left { flex: 1; min-width: 0; }
  .col-right { flex: 1; min-width: 0; }

  .today-marker { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #bbb; margin: 2px 0; }
  .today-marker::before, .today-marker::after { content: ''; flex: 1; height: 1px; background: #ddd; }

  .empty-message {
    text-align: center; font-size: 12.5px; color: #aaa; padding: 30px 10px;
    border: 1px dashed #ddd; border-radius: 10px; line-height: 1.8;
  }

  /* 今日の告知 */
  .today-box { border-radius: 12px; overflow: hidden; margin-bottom: 14px; }
  .today-entry { padding: 14px 16px; background: #fff; border: 1px solid #e0e0e0; border-left: 6px solid #ccc; }
  .today-entry:not(:last-child) { margin-bottom: 8px; }
  .today-congrats { font-size: 11px; color: #999; margin-bottom: 4px; }
  .today-text { font-size: 17px; font-weight: 800; color: #1a1a1a; line-height: 1.4; overflow-wrap: anywhere; }

  .next-main { font-size: 13px; font-weight: 600; color: #333; line-height: 1.7; overflow-wrap: anywhere; }
  .next-sub { font-size: 11px; color: #aaa; margin-top: 2px; line-height: 1.6; overflow-wrap: anywhere; }
  .name-badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-weight: 700; margin: 0 1px; }
  .badge-sep { color: #ccc; margin: 0 1px; }

  /* ---------- 誕生日順・デビュー日順・デビュー順 ---------- */
  #panel-cal .char-list { display: flex; flex-direction: column; gap: 6px; }
  #panel-cal .char-row {
    position: relative; display: flex; align-items: center; justify-content: space-between;
    padding: 9px 14px 9px 22px; border-radius: 8px; font-size: 13px;
  }
  /* 左端の縦ラインで作品を示す(文字色・背景色はキャラクターのまま)。白い縁で、背景が作品色に近い場合も判別できる */
  #panel-cal .char-row::before, .ev-row::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 8px;
    background: var(--work); box-shadow: 2px 0 0 #fff; border-radius: 8px 0 0 8px;
  }
  #panel-cal .char-rank { font-size: 11px; opacity: 0.75; margin-right: 8px; }
  #panel-cal .char-name { font-weight: 600; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  #panel-cal .char-date { font-size: 12px; white-space: nowrap; text-align: right; flex-shrink: 0; }
  #panel-cal .char-date .days-note { opacity: 0.7; font-size: 11px; margin-left: 4px; }

  .period-card {
    border-radius: 12px; padding: 13px 16px; margin-bottom: 10px; font-size: 15px; font-weight: 800;
    line-height: 1.5; text-align: center; overflow-wrap: anywhere;
  }
  #panel-cal .next-box {
    background: #fff; border: 1px solid #e0e0e0; border-left: 6px solid #ccc; border-radius: 12px; padding: 12px 16px 14px;
  }
  #panel-cal .next-box + .next-box { margin-top: 10px; }
  .next-head { font-size: 12px; font-weight: 700; color: #777; margin-bottom: 8px; }
  .next-release { margin-top: 10px; font-size: 10.5px; color: #b3b3b3; line-height: 1.6; }
  .next-block { margin-top: 10px; }
  .next-head + .next-block { margin-top: 0; }

  /* ---------- 交際日順・記念日順・イベント順・登録/保存 ---------- */
  #panel-an .char-list { display: flex; flex-direction: column; gap: 6px; }
  #panel-an .char-row {
    display: grid; grid-template-columns: 18px 1fr 72px 90px; align-items: baseline; gap: 6px;
    padding: 9px 14px; border-radius: 8px; font-size: 13px;
  }
  #panel-an .char-rank { font-size: 11px; opacity: 0.75; }
  #panel-an .char-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #panel-an .char-note { font-size: 11px; opacity: 0.7; text-align: right; white-space: nowrap; }
  #panel-an .char-datecol { font-size: 12px; text-align: right; white-space: nowrap; }
  #panel-an .next-box { background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
  .next-disclaimer { font-size: 10.5px; color: #bbb; margin-top: 12px; line-height: 1.6; }

  /* 月のカレンダー(記念日系・全表示で共通): 予定のある日に色の点。マウスオーバーでその日の予定を表示 */
  .month-box { background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
  .month-nav { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 10px; }
  .month-title { font-size: 13px; font-weight: 700; text-align: center; }
  .month-nav-btn {
    width: 24px; height: 24px; border: 1px solid #ccc; border-radius: 6px; background: #fff;
    color: #666; font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .month-nav-btn:hover { background: #eee; }
  .month-nav-btn.wide { width: auto; padding: 0 9px; font-size: 11.5px; }
  .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .month-dow { text-align: center; font-size: 10px; color: #999; padding-bottom: 2px; }
  .month-dow.sun { color: #d44a4a; }
  .month-dow.sat { color: #4a7fd4; }
  .month-day {
    position: relative; aspect-ratio: 1 / 1.05; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; font-size: 11px; border-radius: 10px; border: 2px solid transparent; background: #fafaf8; cursor: default;
  }
  .month-day.blank { background: none; visibility: hidden; }
  .month-day.has { cursor: pointer; background: #fff; border-color: #e6e6e2; }
  .month-day.has:hover { border-color: #bcd9ef; }
  .month-day.is-today { border-color: #1a1a1a; font-weight: 800; }
  .month-day.sel { background: #e6f3fd; border-color: #5BBAF8; }
  .dots { display: flex; gap: 2px; height: 6px; align-items: center; justify-content: center; }
  .dots i { display: block; width: 6px; height: 6px; border-radius: 50%; box-shadow: 0 0 0 1px rgba(0,0,0,0.28); }
  .day-tip {
    position: absolute; bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%);
    background: #1a1a1a; color: #fff; font-size: 10.5px; font-weight: 400; line-height: 1.5; text-align: left;
    padding: 5px 9px; border-radius: 6px; white-space: nowrap; opacity: 0; pointer-events: none;
    transition: opacity 0.12s; z-index: 30;
  }
  .month-day.tip-l .day-tip { left: 0; transform: none; }
  .month-day.tip-r .day-tip { left: auto; right: 0; transform: none; }
  .month-day.has:hover .day-tip, .month-day.show-tip .day-tip { opacity: 1; }

  .register-form {
    background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .form-label { font-size: 12px; color: #888; font-weight: 500; }
  .reg-select {
    width: 100%; padding: 9px 10px; font-size: 13px; border: 1px solid #ccc; border-radius: 8px;
    font-family: inherit; background: #fff; color: #1a1a1a;
  }
  .reg-date-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .reg-date-part {
    width: 56px; padding: 9px 6px; font-size: 13px; text-align: center;
    border: 1px solid #ccc; border-radius: 8px; font-family: inherit; color: #1a1a1a;
  }
  .reg-date-part.year { width: 70px; }
  .reg-date-sep { color: #999; font-size: 13px; }
  .combo-wrap { position: relative; }
  .combo-panel {
    display: none; position: absolute; top: 100%; left: 0; margin-top: 4px; background: #fff;
    border: 1px solid #ccc; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); z-index: 20; min-width: 64px;
  }
  .combo-panel.open { display: block; }
  .combo-panel.scrollable { max-height: 384px; overflow-y: auto; }
  .combo-option { height: 32px; display: flex; align-items: center; justify-content: center; font-size: 13px; cursor: pointer; }
  .combo-option:hover { background: #f0f7ff; }
  .small-btn {
    padding: 8px 12px; font-size: 12.5px; font-weight: 500; border: 1px solid #ccc; border-radius: 8px;
    background: #fff; color: #555; cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  .small-btn:hover { background: #eee; }
  .submit-btn {
    padding: 11px; font-size: 14px; font-weight: 700; border: none; border-radius: 8px;
    background: #5BBAF8; color: #fff; cursor: pointer; font-family: inherit;
  }
  .submit-btn:hover { background: #3aa8f0; }
  .reg-status { font-size: 12px; min-height: 16px; }
  .reg-status.ok { color: #2a8f4f; }
  .reg-status.err { color: #c0392b; }
  .data-box { background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 14px 16px; }
  .data-section { margin-bottom: 14px; }
  .data-section:last-of-type { margin-bottom: 10px; }
  .data-label { font-size: 12px; color: #888; margin-bottom: 6px; }
  .data-row { display: flex; gap: 6px; align-items: stretch; }
  .data-box textarea {
    flex: 1; min-width: 0; font-size: 11.5px; font-family: monospace; padding: 8px; border: 1px solid #ccc;
    border-radius: 8px; resize: vertical; color: #1a1a1a;
  }
  .data-row > .small-btn { flex-shrink: 0; }
  .data-btn-col { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
  .data-btn-col .small-btn { flex: 1; }
  .reset-btn {
    width: 100%; padding: 9px; font-size: 13px; font-weight: 600; border: 1px solid #e0a0a0;
    border-radius: 8px; background: #fff5f5; color: #c0392b; cursor: pointer; font-family: inherit;
  }
  .reset-btn:hover { background: #ffe8e8; }

  /* ---------- 全表示 ---------- */
  .ev-list { display: flex; flex-direction: column; gap: 6px; }
  .ev-row {
    position: relative; display: grid; grid-template-columns: 56px 1fr auto; gap: 8px; align-items: center;
    padding: 9px 12px 9px 22px; border-radius: 8px; font-size: 13px;
  }
  .ev-date { font-size: 12px; font-weight: 700; white-space: nowrap; }
  .ev-name { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
  .ev-name small { display: block; font-weight: 400; font-size: 10.5px; opacity: 0.72; }
  .ev-kind { text-align: right; white-space: nowrap; }
  .ev-tag {
    display: inline-block; font-size: 10.5px; font-weight: 700; padding: 1px 8px; border-radius: 99px;
    background: rgba(255,255,255,0.82); color: #444;
  }
  .ev-detail { display: block; font-size: 11px; opacity: 0.85; margin-top: 2px; }
  .ev-row.is-today { box-shadow: 0 0 0 2px #1a1a1a; }
  .ev-row.past { opacity: 0.55; }
  .all-selected { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12.5px; font-weight: 700; margin-bottom: 8px; }
  .mini-btn { padding: 4px 10px; font-size: 11.5px; border: 1px solid #ccc; border-radius: 6px; background: #fff; color: #666; cursor: pointer; font-family: inherit; }
  .mini-btn:hover { background: #eee; }
  .all-note { font-size: 10.5px; color: #b3b3b3; margin-top: 12px; line-height: 1.6; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #1a1a1a; color: #fff; font-size: 13px; padding: 7px 18px; border-radius: 99px;
    opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 40;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 700px) {
    body { padding: 16px 12px; }
    .layout { flex-direction: column; align-items: stretch; gap: 14px; }
    .col-left, .col-right { flex: 0 0 auto; width: 100%; }
    .col-right { order: -1; }
    #panel-cal .char-row { padding: 9px 12px 9px 20px; }
    #panel-cal .next-box { padding: 12px 14px 14px; }
    .ev-row { padding: 9px 10px 9px 20px; }
  }
  @media (max-width: 380px) {
    .view-tab { font-size: 12px; padding: 8px 6px; min-width: 64px; }
    #panel-cal .char-row { padding: 9px 10px 9px 18px; font-size: 12.5px; }
    #panel-cal .char-date { font-size: 11.5px; }
    #panel-cal .char-date .days-note { font-size: 10.5px; margin-left: 3px; }
    .ev-row { grid-template-columns: 50px 1fr auto; gap: 6px; font-size: 12.5px; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>星色/音楽院カレンダー</h1>
  <div class="subtitle">ステディ全27名+カレ全5名(2026年11月14日現在)</div>

  <!-- 誕生日順・デビュー日順・デビュー順 -->
  <div class="tab-panel" id="panel-cal">
    <div class="layout">
      <div class="col-left">
        <div class="char-list" id="cal-list"></div>
      </div>
      <div class="col-right">
        <div id="cal-period-box"></div>
        <div class="today-box" id="cal-today-box"></div>
        <div id="cal-next-boxes"></div>
      </div>
    </div>
  </div>

  <!-- 交際日順・記念日順・イベント順・登録/保存 -->
  <div class="tab-panel" id="panel-an">
    <div class="layout">
      <div class="col-left">
        <div id="an-list-area"></div>
      </div>
      <div class="col-right">
        <div class="today-box" id="an-today-box"></div>
        <div class="next-box" id="an-next-box"></div>
        <div class="month-box">
          <div class="month-nav">
            <button class="month-nav-btn" id="an-month-prev" aria-label="前月">&lt;</button>
            <div class="month-title" id="an-month-title"></div>
            <button class="month-nav-btn" id="an-month-next" aria-label="翌月">&gt;</button>
            <button class="month-nav-btn wide" id="an-month-today">今月</button>
          </div>
          <div class="month-grid" id="an-month-grid"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 今月の一覧(誕生日・デビュー日・記念日・リリース日) -->
  <div class="tab-panel active" id="panel-all">
    <div class="layout">
      <div class="col-left">
        <div id="tabs-block">
          <div class="view-tabs" id="view-tabs">
            <button class="view-tab active" data-view="all">今月の一覧</button>
            <button class="view-tab" data-view="birthday">誕生日順</button>
            <button class="view-tab" data-view="debutmd">デビュー日順</button>
            <button class="view-tab" data-view="debut">デビュー順</button>
            <button class="view-tab" data-view="start">交際日順</button>
            <button class="view-tab" data-view="anniv">記念日順</button>
            <button class="view-tab" data-view="event">イベント順</button>
            <button class="view-tab" data-view="register">登録/保存</button>
          </div>
          <div class="filter-bar" id="work-filter">
            <button class="filter-btn active" data-filter="all">全表示</button>
            <button class="filter-btn" data-filter="S" style="--work:#5BBAF8;"><span class="filter-mark"></span>星色ステディ</button>
            <button class="filter-btn" data-filter="H" style="--work:#FF88B6;"><span class="filter-mark"></span>ハートビート音楽院</button>
          </div>
        </div>
        <div id="all-list"></div>
        <div class="all-note" id="all-note"></div>
      </div>
      <div class="col-right">
        <div class="month-box">
          <div class="month-nav">
            <button class="month-nav-btn" id="all-prev" aria-label="前月">&lt;</button>
            <div class="month-title" id="all-title"></div>
            <button class="month-nav-btn" id="all-next" aria-label="翌月">&gt;</button>
            <button class="month-nav-btn wide" id="all-today-btn">今月</button>
          </div>
          <div class="month-grid" id="all-grid"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

function getTextColor(hex) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const luminance = (0.299*r + 0.587*g + 0.114*b) / 255;
  return luminance > 0.6 ? '#1a1a1a' : '#ffffff';
}
function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

const today = new Date(); today.setHours(0,0,0,0);
const todayY = today.getFullYear(), todayM = today.getMonth()+1, todayD = today.getDate();
const MSDAY = 86400000;
function diffDays(date) { return Math.round((date - today) / MSDAY); }
function pad2(n) { return String(n).padStart(2,'0'); }

/* 一覧の行表示用(今日ちょうどなら0日、それ以外は次の到来日まで) */
function daysUntilNext(m, d) {
  let cand = new Date(todayY, m-1, d);
  if (cand < today) cand = new Date(todayY+1, m-1, d);
  return diffDays(cand);
}
/* 名前のバッジ(予告表示用) */
function badgeHtml(item) {

}

/* リリースから半年の月日。wrap=true は翌年の月にまたがる場合(例: 7月リリース→1月) */
function halfInfo(rel) {
  const m = ((rel[1] - 1 + 6) % 12) + 1;
  return { m, d: rel[2], wrap: m < rel[1] };
}
/* 指定した年のハーフアニバーサリーが何周年目か(例: 星色の2024年8月=1.5、音楽院の2027年1月=1.5) */
function halfCount(rel, year) {
  return (year - rel[0]) + (halfInfo(rel).wrap ? -0.5 : 0.5);
}

let toastTimer = null;

/* ---- 作品の表示切替(すべてのタブで共通) ---- */
let workFilter = 'all';   /* 'all' | 'S'(星色ステディのみ) | 'H'(ハートビート音楽院のみ) */
function poolOn(pool) { return workFilter === 'all' || workFilter === pool; }

/* ---- 記念日の登録データ(永続化・符号化) ---- */
const STORAGE_KEY = 'calendar08_registrations';
const LEGACY_STORAGE_KEY = 'anniversary02_registrations';  /* 以前の記念日カレンダーの保存データも引き継ぐ */
let registrations = []; // [{code, start:[y,m,d]}]
let COUPLES = [];

function encodeSave() {
  return registrations.map(r => `${r.code}-${r.start[0]}${pad2(r.start[1])}${pad2(r.start[2])}`).join(',');
}
function decodeSave(str) {
  const tokens = str.trim().split(/[,\s]+/).filter(Boolean);
  const out = [];
  const seen = new Set();
  tokens.forEach(t => {
    const m = t.match(/^([SH])(\d+)-(\d{4})(\d{2})(\d{2})$/);
    if (!m) return;
    const code = m[1] + Number(m[2]);
    if (!ALL_CHAR_MAP[code] || seen.has(code)) return;
    seen.add(code);
    out.push({ code, start: [Number(m[3]), Number(m[4]), Number(m[5])] });
  });
  return out;
}
function saveRegistrations() {
  localStorage.setItem(STORAGE_KEY, encodeSave());
}
function loadRegistrations() {
  let saved = localStorage.getItem(STORAGE_KEY);
  if (saved === null) saved = localStorage.getItem(LEGACY_STORAGE_KEY) || '';
  registrations = saved ? decodeSave(saved) : [];
}
function rebuildCouples() {
  COUPLES = registrations.map(r => {
    const c = ALL_CHAR_MAP[r.code];
    return { name: c.name, color: c.color, text: c.text, start: r.start, code: r.code };
  });
}
/* 作品の表示切替に合わせた、記念日の登録(コードの先頭がSなら星色ステディ・Hなら音楽院) */
function visibleCouples() { return COUPLES.filter(c => poolOn(c.code[0])); }

/* ---- 記念日イベント(1,3,6ヶ月→以降半年ごと) ---- */
function milestoneMonthsList(maxMonths) {
  const list = [1,3];
  for (let m = 6; m <= maxMonths; m += 6) list.push(m);
  return list;
}
function addMonths(dateYMD, months) {
  const [y,m,d] = dateYMD;
  return new Date(y, m-1+months, d);
}
function milestoneLabel(months) {
  if (months < 12) return `${months}ヶ月`;
  if (months % 12 === 0) return `${months/12}年`;
  return `${Math.floor(months/12)}年${months%12}ヶ月`;
}
function nextMilestoneStrict(start) {
  const months = milestoneMonthsList(600);
  for (const mo of months) {
    const d = addMonths(start, mo);
    if (d > today) return { date: d, months: mo };
  }
  return null;
}
function lastHeldMilestone(start) {
  const months = milestoneMonthsList(600);
  let held = null;
  for (const mo of months) {
    const d = addMonths(start, mo);
    if (d <= today) held = { mo, date: d }; else break;
  }
  return held;
}



/* ============================================================
   月のカレンダー(記念日系のタブと「全表示」で共通)
   予定のある日に色の点を付け、マウスオーバーでその日の予定を表示する
   ============================================================ */
const calState = { y: todayY, m: todayM };
const DOW = ['日','月','火','水','木','金','土'];

/* byDay = { 日: [{ dot: 点の色, tip: 表示する文言 }, ...] } */
function drawCalendar(gridId, titleId, byDay, selectedDay) {
  document.getElementById(titleId).textContent = `${calState.y}年${calState.m}月`;
  const days = new Date(calState.y, calState.m, 0).getDate();
  const startDow = new Date(calState.y, calState.m - 1, 1).getDay();
  let h = DOW.map((l, i) => `<div class="month-dow${i === 0 ? ' sun' : i === 6 ? ' sat' : ''}">${l}</div>`).join('');
  for (let i = 0; i < startDow; i++) h += '<div class="month-day blank"></div>';
  for (let d = 1; d <= days; d++) {
    const list = byDay[d] || [];
    const col = (startDow + d - 1) % 7;
    const cls = ['month-day'];
    if (list.length) cls.push('has');
    if (calState.y === todayY && calState.m === todayM && d === todayD) cls.push('is-today');
    if (selectedDay === d) cls.push('sel');
    if (col <= 1) cls.push('tip-l'); else if (col >= 5) cls.push('tip-r');
    const dots = list.slice(0, 4).map(e => `<i style="background:${e.dot};"></i>`).join('');
    const tip = list.length ? `<span class="day-tip">${list.map(e => `<div>${e.tip}</div>`).join('')}</span>` : '';
    h += `<div class="${cls.join(' ')}" data-day="${d}">${d}<span class="dots">${dots}</span>${tip}</div>`;
  }
  document.getElementById(gridId).innerHTML = h;
}

/* 登録した人の記念日イベント(1,3,6ヶ月→以降半年ごと)のうち、指定した年月に当たるもの */
function milestoneEventsOfMonth(c, y, m) {
  const out = [];
  for (const mo of milestoneMonthsList(600)) {
    const d = addMonths(c.start, mo);
    const dy = d.getFullYear(), dm = d.getMonth() + 1;
    if (dy > y || (dy === y && dm > m)) break;
    if (dy === y && dm === m) out.push({ day: d.getDate(), label: milestoneLabel(mo) });
  }
  return out;
}


/* ============================================================
   全表示(誕生日・デビュー日・記念日・リリース日を月ごとに1つにまとめて表示)
   ============================================================ */
const ALLTAB = (function () {
  let selectedDay = null;
  const el = id => document.getElementById(id);
  const KIND_LABEL = { release: 'リリース', bday: '誕生日', debut: 'デビュー', anniv: '記念日' };
  const KIND_ORDER = { release: 0, bday: 1, debut: 2, anniv: 3 };

  /* 指定した年月の予定を、作品の表示切替に合わせて日付順にすべて集める */
  function eventsOfMonth(y, m) {
    const ev = [];
    ['S', 'H'].forEach((p, pi) => {
      if (!poolOn(p)) return;
      const W = WORKS[p], rel = W.release, h = halfInfo(rel);
      const base = { kind: 'release', name: W.label, bg: W.color, fg: getTextColor(W.color), work: W.color, dot: W.color, order: pi };
      if (m === rel[1] && y >= rel[0]) {
        const n = y - rel[0];
        ev.push({ ...base, day: rel[2], detail: n > 0 ? `${n}周年` : 'リリース日' });
      }
      if (m === h.m) {
        const c = halfCount(rel, y);
        if (c > 0) ev.push({ ...base, day: h.d, detail: `${c}周年` });
      }
    });
    ALL_CHARACTERS.forEach((c, ci) => {
      if (!poolOn(c.pool)) return;
      const base = { name: c.name, bg: c.color, fg: c.text, work: c.workColor, dot: c.color, order: ci };
      if (c.bday[0] === m) ev.push({ ...base, kind: 'bday', day: c.bday[1], detail: '' });
      if (c.debut[1] === m && y >= c.debut[0]) {
        const n = y - c.debut[0];
        ev.push({ ...base, kind: 'debut', day: c.debut[2], detail: n > 0 ? `${n}周年` : 'デビュー日' });
      }
    });
    visibleCouples().forEach(cp => {
      const c = ALL_CHAR_MAP[cp.code];
      const base = { name: c.name, bg: c.color, fg: c.text, work: c.workColor, dot: c.color, order: ALL_CHARACTERS.indexOf(c) };
      milestoneEventsOfMonth(cp, y, m).forEach(e => ev.push({ ...base, kind: 'anniv', day: e.day, detail: `交際${e.label}` }));
    });
    ev.sort((a, b) => a.day - b.day || KIND_ORDER[a.kind] - KIND_ORDER[b.kind] || a.order - b.order);
    return ev;
  }

  function relNote(y, m, day) {
    const diff = diffDays(new Date(y, m - 1, day));
    return diff === 0 ? '今日' : diff > 0 ? `あと${diff}日` : `${-diff}日前`;
  }
  function tipText(e) {
    return `${e.name} ${KIND_LABEL[e.kind]}${e.detail ? ' ' + e.detail : ''}`;
  }

  function rowHtml(e) {
    const cur = calState.y === todayY && calState.m === todayM;
    const cls = ['ev-row'];
    if (cur && e.day === todayD) cls.push('is-today');
    if (cur && e.day < todayD) cls.push('past');
    const dow = DOW[new Date(calState.y, calState.m - 1, e.day).getDay()];
    return `<div class="${cls.join(' ')}" style="background:${e.bg};color:${e.fg};--work:${e.work};">
      <span class="ev-date">${e.day}日(${dow})</span>
      <span class="ev-name">${e.name}<small>${relNote(calState.y, calState.m, e.day)}</small></span>
      <span class="ev-kind"><span class="ev-tag">${KIND_LABEL[e.kind]}</span>${e.detail ? `<span class="ev-detail">${e.detail}</span>` : ''}</span>
    </div>`;
  }

  function renderList(evs) {
    const wrap = el('all-list');
    if (evs.length === 0) {
      wrap.innerHTML = '<div class="empty-message">この月の予定はありません。</div>';
      return;
    }
    const shown = selectedDay === null ? evs : evs.filter(e => e.day === selectedDay);
    const rows = shown.map(rowHtml);
    if (selectedDay === null && calState.y === todayY && calState.m === todayM) {
      let at = shown.length;
      for (let i = 0; i < shown.length; i++) { if (shown[i].day >= todayD) { at = i; break; } }
      rows.splice(at, 0, '<div class="today-marker">今日</div>');
    }
    const head = selectedDay === null ? ''
      : `<div class="all-selected"><span>${calState.m}月${selectedDay}日の予定</span><button type="button" class="mini-btn" id="all-clear-day">月全体を表示</button></div>`;
    wrap.innerHTML = head + `<div class="ev-list">${rows.join('')}</div>`;
  }

  function render() {
    const evs = eventsOfMonth(calState.y, calState.m);
    if (selectedDay !== null && !evs.some(e => e.day === selectedDay)) selectedDay = null;
    const byDay = {};
    evs.forEach(e => { (byDay[e.day] = byDay[e.day] || []).push({ dot: e.dot, tip: tipText(e) }); });
    drawCalendar('all-grid', 'all-title', byDay, selectedDay);
    renderList(evs);
    el('all-note').textContent = COUPLES.length === 0 ? '記念日は、「登録/保存」で登録した内容が表示されます。' : '';
  }

  el('all-grid').addEventListener('click', e => {
    const cell = e.target.closest('.month-day.has');
    if (!cell) return;
    const d = Number(cell.dataset.day);
    selectedDay = selectedDay === d ? null : d;
    render();
  });
  el('all-list').addEventListener('click', e => {
    if (e.target.closest('#all-clear-day')) { selectedDay = null; render(); }
  });

  return { render, eventsOfMonth, clearSelection() { selectedDay = null; } };
})();


/* ============================================================

const CAL = (function () {
  let mode = 'birthday';

function visibleChars() {
  return workFilter === 'all' ? ALL_CHARACTERS : ALL_CHARACTERS.filter(c => c.pool === workFilter);

// 次回優先(今日ちょうどは除外して次の年に繰り越す)。「次の◯◯」ランキング用
function nextGroups(list, monthOf, dayOf) {
  const items = list.map(c => {
    const m = monthOf(c), d = dayOf(c);
    let cand = new Date(todayY, m-1, d);
    if (cand <= today) cand = new Date(todayY+1, m-1, d);
    return { name: c.name, color: c.color, text: c.text, date: cand };
  });
  const byDate = {};
  items.forEach(it => {
    const key = it.date.getTime();
    (byDate[key] = byDate[key] || []).push(it);
  });
  return Object.entries(byDate)
    .map(([key, arr]) => ({ date: new Date(Number(key)), items: arr }))
    .sort((a,b) => a.date - b.date);
}

/* ---- ゲームのリリース日・ハーフアニバーサリー(リリースから半年) ---- */
/* 表示対象の作品(作品の切り替えに合わせる) */
function visiblePools() { return workFilter === 'all' ? ['S', 'H'] : [workFilter]; }

/* 次のリリース記念日(リリース日とハーフアニバーサリーのうち、今日より後で近い方)。今日ちょうどは含めない */
function nextReleaseInfo(pool) {
  const rel = WORKS[pool].release, h = halfInfo(rel);
  const cands = [];

  let y = todayY, date = new Date(y, rel[1]-1, rel[2]);
  if (date <= today) { y++; date = new Date(y, rel[1]-1, rel[2]); }
  const years = y - rel[0];
  if (years >= 1) cands.push({ date, label: String(years) });

  let y2 = todayY, date2 = new Date(y2, h.m-1, h.d);
  if (date2 <= today) { y2++; date2 = new Date(y2, h.m-1, h.d); }
  const c = halfCount(rel, y2);
  if (c > 0) cands.push({ date: date2, label: String(c) });

  cands.sort((a, b) => a.date - b.date);
  return cands[0] || null;
}

/* 今日がリリース日・ハーフアニバーサリーの当日なら、お知らせを返す */
function releaseTodayEntries() {
  const out = [];
  visiblePools().forEach(p => {
    const W = WORKS[p], rel = W.release, h = halfInfo(rel);
    if (todayM === rel[1] && todayD === rel[2]) {
      const years = todayY - rel[0];
      if (years > 0) out.push({ text: `今日は${W.label}のリリース${years}周年です`, color: W.color });
      else if (years === 0) out.push({ text: `今日は${W.label}のリリース日です`, color: W.color });
    }
    if (todayM === h.m && todayD === h.d) {
      const c = halfCount(rel, todayY);
      if (c > 0) out.push({ text: `今日は${W.label}のリリース${c}周年です`, color: W.color });
    }
  });
  return out;
}

/* リリースの月、リリースから半年の月は、1か月間「周年期間」のカードを出す */
function periodCards() {
  const out = [];
  visiblePools().forEach(p => {
    const W = WORKS[p], rel = W.release, h = halfInfo(rel);
    if (todayM === rel[1]) {
      const years = todayY - rel[0];
      if (years >= 1) out.push({ pool: p, text: `今月は${W.label}の${years}周年期間です` });
    }
    if (todayM === h.m) {
      const c = halfCount(rel, todayY);
      if (c > 0) out.push({ pool: p, text: `今月は${W.label}の${c}周年期間です` });
    }
  });
  return out;
}

/* ---- 一覧 ---- */
function sortedList(m) {

  } else if (m === 'birthday') {
    list.sort((a,b) => a.bday[0]-b.bday[0] || a.bday[1]-b.bday[1]);
  } else if (m === 'debutmd') {
    list.sort((a,b) => a.debut[1]-b.debut[1] || a.debut[2]-b.debut[2] || a.debut[0]-b.debut[0]);
  }
  return list;
}

function dateLabel(c, m) {
  if (m === 'debut') {
    const full = `${c.debut[0]}年${c.debut[1]}月${c.debut[2]}日`;
    const since = -diffDays(new Date(c.debut[0], c.debut[1]-1, c.debut[2]));
    return `${full}<span class="days-note">${since}日前</span>`;
  }
  if (m === 'birthday') {
    const md = `${c.bday[0]}月${c.bday[1]}日`;
    const until = daysUntilNext(c.bday[0], c.bday[1]);
    return `${md}<span class="days-note">あと${until}日</span>`;
  }
  const md = `${c.debut[1]}月${c.debut[2]}日`;
  const until = daysUntilNext(c.debut[1], c.debut[2]);
  return `${md}<span class="days-note">あと${until}日</span>`;
}

function renderList(m) {
  const list = sortedList(m);
  const wrap = document.getElementById('cal-list');
  const rows = list.map((c, i) => `
    <div class="char-row" style="background:${c.color};color:${c.text};--work:${c.workColor};">
      <span class="char-rank">${i+1}</span>
      <span class="char-name">${c.name}</span>
      <span class="char-date">${dateLabel(c, m)}</span>
    </div>
  `);

  if (m === 'birthday' || m === 'debutmd') {
    const getMD = m === 'birthday'
      ? (c) => [c.bday[0], c.bday[1]]
      : (c) => [c.debut[1], c.debut[2]];
    let insertAt = list.length;
    for (let i = 0; i < list.length; i++) {
      const [mm, dd] = getMD(list[i]);
      if (mm > todayM || (mm === todayM && dd >= todayD)) { insertAt = i; break; }
    }
    rows.splice(insertAt, 0, '<div class="today-marker">今日</div>');
  }

  wrap.innerHTML = rows.join('');
}


function renderAll() {
  renderPeriodBox();
  renderTodayBox();
  renderNextBox();
  renderList(mode);
}

return { render: renderAll, setMode(m) { mode = m; } };
})();


/* ============================================================
   交際日順・記念日順・イベント順・登録/保存
   ============================================================ */
const AN = (function () {
/* ---- 今日の告知 ---- */
function renderTodayBox() {
  const box = document.getElementById('an-today-box');
  const todays = [];
  visibleCouples().forEach(c => {
    const months = milestoneMonthsList(600);
    for (const mo of months) {
      const d = addMonths(c.start, mo);
      if (d.getTime() === today.getTime()) {
        todays.push({ text: `${c.name}さんとの交際${milestoneLabel(mo)}記念日イベントが開催中です`, color: c.color, sortYear: c.start[0] });
        break;
      }
      if (d > today) break;
    }
  });
  todays.sort((a,b) => a.sortYear - b.sortYear);
  if (todays.length === 0) { box.style.display = 'none'; box.innerHTML = ''; return; }
  box.style.display = '';
  box.innerHTML = todays.map(t => `
    <div class="today-entry" style="border-left-color:${t.color};">
      <div class="today-congrats">おめでとうございます🎉</div>
      <div class="today-text">${t.text}</div>
    </div>
  `).join('');
}

/* ---- 次の記念日イベント(お知らせ) ---- */
function renderNextBox() {
  const box = document.getElementById('an-next-box');
  const disclaimer = '<div class="next-disclaimer">※記念日イベントはステディ・カレによって実装時期が異なるため、予告通りの開催とはならない場合があります。</div>';
  const VC = visibleCouples();
  if (VC.length === 0) {
    box.innerHTML = '<div class="next-sub">登録された記念日がありません。</div>' + disclaimer;
    return;
  }
  const items = VC.map(c => {
    const nm = nextMilestoneStrict(c.start);
    return { name: c.name, color: c.color, text: c.text, date: nm.date, months: nm.months };
  });
  const byDate = {};
  items.forEach(it => { const key = it.date.getTime(); (byDate[key] = byDate[key] || []).push(it); });
  const groups = Object.entries(byDate)
    .map(([key, arr]) => ({ date: new Date(Number(key)), items: arr }))
    .sort((a,b) => a.date - b.date);

  function line(group, isMain) {
    if (!group) return '';
    const d = diffDays(group.date);
    const md = `${group.date.getMonth()+1}月${group.date.getDate()}日`;
    const names = group.items.map(badgeHtml).join('<span class="badge-sep">・</span>');
    const label = group.items.length === 1 ? `交際${milestoneLabel(group.items[0].months)}` : '';
    const cls = isMain ? 'next-main' : 'next-sub';
    const prefix = isMain ? '次の記念日イベントは' : '';
    return `<div class="${cls}">${prefix}${names} ${label}<br>${md}まであと${d}日</div>`;
  }
  box.innerHTML = line(groups[0], true) + line(groups[1], false) + line(groups[2], false) + disclaimer;
}

/* ---- リスト(交際日順・記念日順・イベント順) ---- */
function sortedList(mode) {
  if (mode === 'event') {
    return [...visibleCouples()].sort((a,b) => nextMilestoneStrict(a.start).date - nextMilestoneStrict(b.start).date);
  }
  const list = [...visibleCouples()];
  if (mode === 'start') {
    list.sort((a,b) => a.start[0]-b.start[0] || a.start[1]-b.start[1] || a.start[2]-b.start[2]);
  } else {
    list.sort((a,b) => a.start[1]-b.start[1] || a.start[2]-b.start[2] || a.start[0]-b.start[0]);
  }
  return list;
}
function rowInfo(c, mode) {
  if (mode === 'start') {
    const since = -diffDays(new Date(c.start[0], c.start[1]-1, c.start[2]));
    return { note: `${since}日前`, date: `${c.start[0]}年${c.start[1]}月${c.start[2]}日` };
  }
  if (mode === 'anniv') {
    const until = daysUntilNext(c.start[1], c.start[2]);
    return { note: `あと${until}日`, date: `${c.start[1]}月${c.start[2]}日` };
  }
  const held = lastHeldMilestone(c.start);
  const note = held ? `${milestoneLabel(held.mo)}${held.date.getTime() === today.getTime() ? '開催中' : '開催済'}` : '';
  const nm = nextMilestoneStrict(c.start);
  return { note, date: `あと${diffDays(nm.date)}日` };
}

const EMPTY_MSG = '<div class="empty-message">まだ何も登録されていません。<br>「登録/保存」から交際開始日を登録してください。</div>';

function renderList(mode) {
  const wrap = document.getElementById('an-list-area');
  if (COUPLES.length === 0) { wrap.innerHTML = EMPTY_MSG; return; }
  if (visibleCouples().length === 0) { wrap.innerHTML = '<div class="empty-message">この作品の登録はありません。</div>'; return; }

  const list = sortedList(mode);
  const rows = list.map((c, i) => {
    const info = rowInfo(c, mode);
    return `
    <div class="char-row" style="background:${c.color};color:${c.text};">
      <span class="char-rank">${i+1}</span>
      <span class="char-name">${c.name}</span>
      <span class="char-note">${info.note}</span>
      <span class="char-datecol">${info.date}</span>
    </div>
  `;
  });

  if (mode === 'anniv') {
    let insertAt = list.length;
    for (let i = 0; i < list.length; i++) {
      const m = list[i].start[1], d = list[i].start[2];
      if (m > todayM || (m === todayM && d >= todayD)) { insertAt = i; break; }
    }
    rows.splice(insertAt, 0, '<div class="today-marker">今日</div>');
  }
  wrap.innerHTML = `<div class="char-list">${rows.join('')}</div>`;
}

/* ---- 登録フォーム ---- */
function renderRegisterForm() {
  const wrap = document.getElementById('an-list-area');
  const registeredCodes = new Set(registrations.map(r => r.code));
  const sPool = poolOn('S') ? ALL_CHARACTERS.filter(c => c.pool === 'S' && !registeredCodes.has(c.code)) : [];
  const hPool = poolOn('H') ? ALL_CHARACTERS.filter(c => c.pool === 'H' && !registeredCodes.has(c.code)) : [];

  const optionsHtml = (list) => list.map(c => `<option value="${c.code}">${c.name}</option>`).join('');

  wrap.innerHTML = `
    <div class="register-form">
      <div>
        <div class="form-label">ステディ・カレを選択</div>
        <select class="reg-select" id="reg-char">
          <option value="" disabled selected>選択してください</option>
          ${sPool.length ? `<optgroup label="星色ステディ">${optionsHtml(sPool)}</optgroup>` : ''}
          ${hPool.length ? `<optgroup label="ハートビート音楽院">${optionsHtml(hPool)}</optgroup>` : ''}
        </select>
      </div>
      <div>
        <div class="form-label">交際開始日を選択</div>
        <div class="reg-date-row">
          <div class="combo-wrap">
            <input type="text" inputmode="numeric" placeholder="年" class="reg-date-part year" id="reg-year" maxlength="4" autocomplete="off">
            <div class="combo-panel" id="year-panel"></div>
          </div>
          <span class="reg-date-sep">/</span>
          <div class="combo-wrap">
            <input type="text" inputmode="numeric" placeholder="月" class="reg-date-part" id="reg-month" maxlength="2" autocomplete="off">
            <div class="combo-panel" id="month-panel"></div>
          </div>
          <span class="reg-date-sep">/</span>
          <div class="combo-wrap">
            <input type="text" inputmode="numeric" placeholder="日" class="reg-date-part" id="reg-day" maxlength="2" autocomplete="off">
            <div class="combo-panel scrollable" id="day-panel"></div>
          </div>
        </div>
      </div>
      <button type="button" class="submit-btn" id="reg-submit-btn">登録する</button>
      <div class="reg-status" id="reg-status"></div>

      <div class="data-box">
        <div class="data-section">
          <div class="data-label">保存用コード(コピーして控えてください)</div>
          <div class="data-row">
            <textarea id="export-text" rows="2" readonly></textarea>
            <button class="small-btn" id="copy-btn">コピー</button>
          </div>
        </div>
        <div class="data-section">
          <div class="data-label">保存用コードを読み込む</div>
          <div class="data-row">
            <textarea id="import-text" rows="2" placeholder="保存用コードを貼り付け"></textarea>
            <div class="data-btn-col">
              <button class="small-btn" id="paste-btn">貼付</button>
              <button class="small-btn" id="import-btn">読込</button>
            </div>
          </div>
        </div>
        <button class="reset-btn" id="reset-btn">すべてリセット</button>
      </div>
    </div>
  `;

  if (sPool.length === 0 && hPool.length === 0) {
    document.getElementById('reg-char').disabled = true;
    document.getElementById('reg-submit-btn').disabled = true;
    document.getElementById('reg-status').textContent = '全キャラクターが登録済みです。';
  }

  const yearEl = document.getElementById('reg-year');
  const monthEl = document.getElementById('reg-month');
  const dayEl = document.getElementById('reg-day');

  const yearPanel = document.getElementById('year-panel');
  const monthPanel = document.getElementById('month-panel');
  const dayPanel = document.getElementById('day-panel');

  function closeAllPanels() {
    [yearPanel, monthPanel, dayPanel].forEach(p => p.classList.remove('open'));
  }
  function buildPanel(panel, values, onPick) {
    panel.innerHTML = values.map(v => `<div class="combo-option">${v}</div>`).join('');
    panel.querySelectorAll('.combo-option').forEach((opt, i) => {
      opt.addEventListener('mousedown', (e) => {
        e.preventDefault(); // inputのblurより先に発火させ、値を確実に反映する
        onPick(values[i]);
        closeAllPanels();
      });
    });
  }

  // 年・月は全件を常に表示(スクロールなし)。年は今後候補が増えても高さが伸びるだけで全件表示を維持する。
  const yearValues = [];
  for (let y = todayY + 1; y >= 2023; y--) yearValues.push(String(y));
  buildPanel(yearPanel, yearValues, (v) => { yearEl.value = v; updateDayOptions(); monthEl.focus(); });

  const monthValues = [];
  for (let m = 1; m <= 12; m++) monthValues.push(pad2(m));
  buildPanel(monthPanel, monthValues, (v) => { monthEl.value = v; updateDayOptions(); dayEl.focus(); });

  // 日は年・月に応じた実日数までを表示。月パネルと同じ高さ(12件分)まではスクロールなしで見え、
  // それ以降はスクロールで表示する。
  function updateDayOptions() {
    let maxDay = 31;
    if (monthEl.value) {
      const m = Number(monthEl.value);
      const y = yearEl.value ? Number(yearEl.value) : 2001; // 年未入力時は平年扱いで控えめに
      maxDay = new Date(y, m, 0).getDate();
    }
    const dayValues = [];
    for (let d = 1; d <= maxDay; d++) dayValues.push(pad2(d));
    buildPanel(dayPanel, dayValues, (v) => { dayEl.value = v; closeAllPanels(); });
    if (dayEl.value && Number(dayEl.value) > maxDay) dayEl.value = '';
  }
  updateDayOptions();

  // 年が4桁、月日が2桁に達したら自動的に次の欄へ進む(直接入力時)
  yearEl.addEventListener('input', () => {
    yearEl.value = yearEl.value.replace(/\D/g, '').slice(0, 4);
    if (yearEl.value.length === 4) monthEl.focus();
    updateDayOptions();
  });
  monthEl.addEventListener('input', () => {
    monthEl.value = monthEl.value.replace(/\D/g, '').slice(0, 2);
    if (monthEl.value.length === 2) dayEl.focus();
    updateDayOptions();
  });
  dayEl.addEventListener('input', () => {
    dayEl.value = dayEl.value.replace(/\D/g, '').slice(0, 2);
  });

  // フォーカスでパネルを開く(タップ/クリックでの選び直しが常に全件からできる)
  yearEl.addEventListener('focus', () => { closeAllPanels(); yearPanel.classList.add('open'); });
  monthEl.addEventListener('focus', () => { closeAllPanels(); monthPanel.classList.add('open'); });
  dayEl.addEventListener('focus', () => { closeAllPanels(); dayPanel.classList.add('open'); });
  document.addEventListener('mousedown', (e) => {
    if (!e.target.closest('.combo-wrap')) closeAllPanels();
  });

  /* ---- 保存・読込・リセット(登録タブ内に配置) ---- */
  function refreshExportText() {
    const el = document.getElementById('export-text');
    if (el) el.value = encodeSave();
  }
  refreshExportText();
  document.getElementById('copy-btn').addEventListener('click', () => {
    const text = document.getElementById('export-text').value;
    if (!text) { showToast('登録がありません'); return; }
    navigator.clipboard.writeText(text).then(() => showToast('コピーしました'));
  });
  document.getElementById('paste-btn').addEventListener('click', () => {
    navigator.clipboard.readText().then(text => {
      document.getElementById('import-text').value = text;
    }).catch(() => showToast('クリップボードを読み取れませんでした'));
  });
  document.getElementById('import-btn').addEventListener('click', () => {
    const raw = document.getElementById('import-text').value;
    if (!raw.trim()) { showToast('コードを入力してください'); return; }
    if (registrations.length > 0) {
      if (!confirm('現在の登録内容を、読み込んだコードの内容で置き換えます。よろしいですか？')) return;
    }
    const decoded = decodeSave(raw);
    registrations = decoded;
    saveRegistrations();
    rebuildCouples();
    refreshAll();
    showToast(`${decoded.length}件読み込みました`);
  });
  document.getElementById('reset-btn').addEventListener('click', () => {
    if (!confirm('登録されているすべての記念日データを削除します。よろしいですか？この操作は元に戻せません。')) return;
    registrations = [];
    saveRegistrations();
    rebuildCouples();
    refreshAll();
    showToast('リセットしました');
  });

  document.getElementById('reg-submit-btn').addEventListener('click', () => {
    const code = document.getElementById('reg-char').value;
    const y = Number(yearEl.value), m = Number(monthEl.value), d = Number(dayEl.value);
    const statusEl = document.getElementById('reg-status');
    if (!code) { statusEl.className = 'reg-status err'; statusEl.textContent = 'キャラクターを選択してください。'; return; }
    if (!y || !m || !d || m < 1 || m > 12 || d < 1 || d > new Date(y, m, 0).getDate()) {
      statusEl.className = 'reg-status err'; statusEl.textContent = '存在する交際開始日を正しく入力してください。'; return;
    }
    if (registrations.some(r => r.code === code)) {
      statusEl.className = 'reg-status err'; statusEl.textContent = 'このキャラクターは既に登録されています。'; return;
    }
    registrations.push({ code, start: [y,m,d] });
    saveRegistrations();
    rebuildCouples();
    refreshAll();
    const name = ALL_CHAR_MAP[code].name;
    renderRegisterForm();
    document.getElementById('reg-status').className = 'reg-status ok';
    document.getElementById('reg-status').textContent = `${name}を登録しました。`;
  });
}

/* ---- 月のカレンダー(「全表示」と共通の形式) ----
   登録した人の「交際開始日の日」に色の点を付け、記念日イベントの日には交際〇ヶ月(年)も表示する */
function renderMonthCalendar() {
  const byDay = {};
  const dim = new Date(calState.y, calState.m, 0).getDate();
  const add = (d, item) => { (byDay[d] = byDay[d] || []).push(item); };
  [...visibleCouples()]
    .sort((a,b) => a.start[0]-b.start[0] || a.start[1]-b.start[1] || a.start[2]-b.start[2])
    .forEach(c => {
      const evs = milestoneEventsOfMonth(c, calState.y, calState.m);
      const day = c.start[2];
      const same = evs.find(e => e.day === day);
      if (day <= dim) add(day, { dot: c.color, tip: same ? `${c.name} 交際${same.label}` : c.name });
      evs.filter(e => e.day !== day || day > dim).forEach(e => add(e.day, { dot: c.color, tip: `${c.name} 交際${e.label}` }));
    });
  drawCalendar('an-month-grid', 'an-month-title', byDay, null);
}

/* ---- 全体再描画 ---- */
let currentMode = 'start';
function refreshAll() {
  renderTodayBox();
  renderNextBox();
  renderMonthCalendar();
  if (currentMode === 'register') renderRegisterForm();
  else renderList(currentMode);
  ALLTAB.render();
}

return { render: refreshAll, renderCalendar: renderMonthCalendar, setMode(m) { currentMode = m; } };
})();


/* ============================================================
   タブ・作品の表示切替・月の移動・起動
   ============================================================ */
const VIEW_PANEL = { birthday: 'cal', debutmd: 'cal', debut: 'cal', start: 'an', anniv: 'an', event: 'an', register: 'an', all: 'all' };
let currentView = 'all';
const tabsBlock = document.getElementById('tabs-block');

function setView(v) {
  currentView = v;
  /* タブと作品の表示切替は、リスト側(左の列)の上部だけに置く(右の告知・カレンダーにはかけない) */
  document.querySelector('#panel-' + VIEW_PANEL[v] + ' .col-left').prepend(tabsBlock);
  document.querySelectorAll('.view-tab').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + VIEW_PANEL[v]));
  if (VIEW_PANEL[v] === 'cal') { CAL.setMode(v); CAL.render(); }
  else if (VIEW_PANEL[v] === 'an') { AN.setMode(v); AN.render(); }
  else ALLTAB.render();
}
function setWorkFilter(f) {
  workFilter = f;
  document.querySelectorAll('#work-filter .filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === f));
  CAL.render();
  AN.render();
  ALLTAB.render();
}
function shiftMonth(delta) {
  calState.m += delta;
  if (calState.m < 1) { calState.m = 12; calState.y--; }
  if (calState.m > 12) { calState.m = 1; calState.y++; }
  ALLTAB.clearSelection();
  AN.renderCalendar();
  ALLTAB.render();
}
function backToThisMonth() {
  calState.y = todayY; calState.m = todayM;
  ALLTAB.clearSelection();
  AN.renderCalendar();
  ALLTAB.render();
}

document.querySelectorAll('.view-tab').forEach(btn => btn.addEventListener('click', () => setView(btn.dataset.view)));
document.querySelectorAll('#work-filter .filter-btn').forEach(btn => btn.addEventListener('click', () => setWorkFilter(btn.dataset.filter)));
['an-month-prev', 'all-prev'].forEach(id => document.getElementById(id).addEventListener('click', () => shiftMonth(-1)));
['an-month-next', 'all-next'].forEach(id => document.getElementById(id).addEventListener('click', () => shiftMonth(1)));
['an-month-today', 'all-today-btn'].forEach(id => document.getElementById(id).addEventListener('click', backToThisMonth));
/* 記念日系のカレンダーは、タップでもその日の予定を表示できる(スマホ向け) */
document.getElementById('an-month-grid').addEventListener('click', e => {
  const cell = e.target.closest('.month-day.has');
  const grid = document.getElementById('an-month-grid');
  const wasShown = cell && cell.classList.contains('show-tip');
  grid.querySelectorAll('.month-day.show-tip').forEach(c => c.classList.remove('show-tip'));
  if (cell && !wasShown) cell.classList.add('show-tip');
});

loadRegistrations();
rebuildCouples();
CAL.render();
AN.render();
ALLTAB.render();
</script>
