<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音楽院カレンダー</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif;
    background: #f5f5f0;
    color: #1a1a1a;
    padding: 24px 16px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .container {
    width: 100%;
    max-width: 760px;
  }
  h1 { font-size: 19px; font-weight: 700; text-align: center; }
  .subtitle {
    text-align: center;
    font-size: 12px;
    color: #aaa;
    margin-top: 4px;
    margin-bottom: 18px;
  }

  .layout {
    display: flex;
    gap: 16px;
    align-items: flex-start;
  }
  .col-left { flex: 1; min-width: 0; }
  .col-right { flex: 1; min-width: 0; }

  /* 並び替え */
  .sort-toggle {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
  }
  .sort-btn {
    flex: 1;
    padding: 9px 4px;
    font-size: 12.5px;
    font-weight: 500;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: #fff;
    color: #666;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .sort-btn.active {
    background: #FF88B6;
    color: #fff;
    border-color: #FF88B6;
  }

  .char-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .char-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 14px;
    border-radius: 8px;
    font-size: 13px;
  }
  .char-rank {
    font-size: 11px;
    opacity: 0.75;
    margin-right: 8px;
  }
  .char-name { font-weight: 600; flex: 1; }
  .char-date { font-size: 12px; white-space: nowrap; text-align: right; }
  .char-date .days-note { opacity: 0.7; font-size: 11px; margin-left: 4px; }

  .today-marker {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: #bbb;
    margin: 2px 0;
  }
  .today-marker::before,
  .today-marker::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #ddd;
  }

  /* 今日の告知(別枠・最も目立たせる) */
  .today-box {
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 14px;
  }
  .today-entry {
    padding: 14px 16px;
    background: #fff;
    border: 1px solid #e0e0e0;
    border-left: 6px solid #ccc;
  }
  .today-entry:not(:last-child) { margin-bottom: 8px; }
  .today-congrats {
    font-size: 11px;
    color: #999;
    margin-bottom: 4px;
  }
  .today-text {
    font-size: 17px;
    font-weight: 800;
    color: #1a1a1a;
    line-height: 1.4;
  }

  /* 次の誕生日・次のデビュー日 */
  .next-box {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 12px;
    padding: 14px 16px;
  }
  .next-block { margin-top: 10px; }
  .next-block:first-child { margin-top: 0; }
  .next-main {
    font-size: 13px;
    font-weight: 600;
    color: #333;
    line-height: 1.7;
  }
  .next-sub {
    font-size: 11px;
    color: #aaa;
    margin-top: 2px;
    line-height: 1.6;
  }
  .name-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 6px;
    font-weight: 700;
    margin: 0 1px;
  }
  .badge-sep { color: #ccc; margin: 0 1px; }

  @media (max-width: 700px) {
    .layout { flex-direction: column; }
    .col-right { order: -1; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>音楽院カレンダー</h1>
  <div class="subtitle">カレ全5名(2026年9月現在)※敬称略</div>

  <div class="layout">
    <div class="col-left">
      <div class="sort-toggle">
        <button class="sort-btn active" data-mode="birthday">誕生日順</button>
        <button class="sort-btn" data-mode="debutmd">デビュー日順</button>
        <button class="sort-btn" data-mode="debut">デビュー順</button>
      </div>
      <div class="char-list" id="char-list"></div>
    </div>

    <div class="col-right">
      <div class="today-box" id="today-box"></div>
      <div class="next-box" id="next-box"></div>
    </div>
  </div>
</div>

<script>
const CHARACTERS = [
  { name: '獅堂ケイ',   color: '#BF014E', debut: [2025,7,19], bday: [6,22] },
  { name: '漣大和',     color: '#4289BD', debut: [2025,7,19], bday: [11,18]},
  { name: '綿谷めぐる', color: '#F5F4F9', debut: [2025,7,19], bday: [3,4]  },
  { name: '久世幸斗',   color: '#228B22', debut: [2025,9,13], bday: [2,24] },
  { name: '柴ムサシ',   color: '#FFE200', debut: [2025,9,13], bday: [8,8]  },
];

function getTextColor(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  const luminance = (0.299*r + 0.587*g + 0.114*b) / 255;
  return luminance > 0.6 ? '#1a1a1a' : '#ffffff';
}
CHARACTERS.forEach(c => { c.text = getTextColor(c.color); });

const today = new Date(); today.setHours(0,0,0,0);
const todayY = today.getFullYear(), todayM = today.getMonth()+1, todayD = today.getDate();
const MSDAY = 86400000;

function diffDays(date) { return Math.round((date - today) / MSDAY); }

// 次回優先(今日ちょうどは除外して次の年に繰り越す)。「次の◯◯」ランキング用
function nextGroups(monthOf, dayOf) {
  const items = CHARACTERS.map(c => {
    const m = monthOf(c), d = dayOf(c);
    let cand = new Date(todayY, m-1, d);
    if (cand <= today) cand = new Date(todayY+1, m-1, d);
    return { name: c.name, color: c.color, text: c.text, date: cand };
  });
  const byDate = {};
  items.forEach(it => {
    const key = it.date.getTime();
    (byDate[key] = byDate[key] || []).push(it);
  });
  return Object.entries(byDate)
    .map(([key, arr]) => ({ date: new Date(Number(key)), items: arr }))
    .sort((a,b) => a.date - b.date);
}

// 一覧の行表示用(今日ちょうどなら0日、それ以外は次の到来日まで)
function daysUntilNext(m, d) {
  let cand = new Date(todayY, m-1, d);
  if (cand < today) cand = new Date(todayY+1, m-1, d);
  return diffDays(cand);
}

function renderTodayBox() {
  const box = document.getElementById('today-box');
  const todays = [];
  CHARACTERS.forEach(c => {
    if (c.bday[0] === todayM && c.bday[1] === todayD) {
      todays.push({ text: `今日は${c.name}の誕生日です`, color: c.color, sortYear: -Infinity });
    }
    if (c.debut[1] === todayM && c.debut[2] === todayD) {
      const years = todayY - c.debut[0];
      const label = years > 0 ? `今日は${c.name}のデビュー${years}周年です` : `今日は${c.name}のデビュー日です`;
      todays.push({ text: label, color: c.color, sortYear: c.debut[0] });
    }
  });
  todays.sort((a,b) => a.sortYear - b.sortYear);

  if (todays.length === 0) {
    box.style.display = 'none';
    box.innerHTML = '';
    return;
  }
  box.style.display = '';
  box.innerHTML = todays.map(t => `
    <div class="today-entry" style="border-left-color:${t.color};">
      <div class="today-congrats">おめでとうございます🎉</div>
      <div class="today-text">${t.text}</div>
    </div>
  `).join('');
}

function badgeHtml(item) {
  return `<span class="name-badge" style="background:${item.color};color:${item.text};">${item.name}</span>`;
}

function renderNextLine(prefix, group, isMain) {
  if (!group) return '';
  const d = diffDays(group.date);
  const md = `${group.date.getMonth()+1}月${group.date.getDate()}日`;
  const names = group.items.map(badgeHtml).join('<span class="badge-sep">・</span>');
  const cls = isMain ? 'next-main' : 'next-sub';
  return `<div class="${cls}">${prefix}${names} ${md}まであと${d}日</div>`;
}

function renderNextBox() {
  const box = document.getElementById('next-box');
  const bGroups = nextGroups(c => c.bday[0], c => c.bday[1]);
  const dGroups = nextGroups(c => c.debut[1], c => c.debut[2]);

  let html = '';
  html += '<div class="next-block">';
  html += renderNextLine('次の誕生日は', bGroups[0], true);
  html += renderNextLine('', bGroups[1], false);
  html += renderNextLine('', bGroups[2], false);
  html += '</div>';

  html += '<div class="next-block">';
  html += renderNextLine('次のデビュー日は', dGroups[0], true);
  html += renderNextLine('', dGroups[1], false);
  html += renderNextLine('', dGroups[2], false);
  html += '</div>';

  box.innerHTML = html;
}

function sortedList(mode) {
  const list = [...CHARACTERS];
  if (mode === 'debut') {
    list.sort((a,b) => a.debut[0]-b.debut[0] || a.debut[1]-b.debut[1] || a.debut[2]-b.debut[2]);
  } else if (mode === 'birthday') {
    list.sort((a,b) => a.bday[0]-b.bday[0] || a.bday[1]-b.bday[1]);
  } else if (mode === 'debutmd') {
    list.sort((a,b) => a.debut[1]-b.debut[1] || a.debut[2]-b.debut[2] || a.debut[0]-b.debut[0]);
  }
  return list;
}

function dateLabel(c, mode) {
  if (mode === 'debut') {
    const full = `${c.debut[0]}年${c.debut[1]}月${c.debut[2]}日`;
    const since = -diffDays(new Date(c.debut[0], c.debut[1]-1, c.debut[2]));
    return `${full}<span class="days-note">${since}日前</span>`;
  }
  if (mode === 'birthday') {
    const md = `${c.bday[0]}月${c.bday[1]}日`;
    const until = daysUntilNext(c.bday[0], c.bday[1]);
    return `${md}<span class="days-note">あと${until}日</span>`;
  }
  const md = `${c.debut[1]}月${c.debut[2]}日`;
  const until = daysUntilNext(c.debut[1], c.debut[2]);
  return `${md}<span class="days-note">あと${until}日</span>`;
}

function renderList(mode) {
  const list = sortedList(mode);
  const wrap = document.getElementById('char-list');
  const rows = list.map((c, i) => `
    <div class="char-row" style="background:${c.color};color:${c.text};">
      <span class="char-rank">${i+1}</span>
      <span class="char-name">${c.name}</span>
      <span class="char-date">${dateLabel(c, mode)}</span>
    </div>
  `);

  if (mode === 'birthday' || mode === 'debutmd') {
    const getMD = mode === 'birthday'
      ? (c) => [c.bday[0], c.bday[1]]
      : (c) => [c.debut[1], c.debut[2]];
    let insertAt = list.length;
    for (let i = 0; i < list.length; i++) {
      const [m, d] = getMD(list[i]);
      if (m > todayM || (m === todayM && d >= todayD)) { insertAt = i; break; }
    }
    rows.splice(insertAt, 0, '<div class="today-marker">今日</div>');
  }

  wrap.innerHTML = rows.join('');
}

document.querySelectorAll('.sort-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderList(btn.dataset.mode);
  });
});

renderTodayBox();
renderNextBox();
renderList('birthday');
</script>
</body>
</html>
