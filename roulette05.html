<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星色/音楽院ルーレット</title>
<style>
  :root {
    --accent: #5BBAF8;
    --accent-hover: #3aa8f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif;
    background: #f5f5f0;
    color: #1a1a1a;
    padding: 24px 16px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .container {
    width: 100%;
    max-width: 480px;
  }

  /* タイトル選択(タイトルの位置に左右並びで配置) */
  .title-toggle {
    display: flex;
    gap: 8px;
  }
  .title-btn {
    flex: 1;
    padding: 10px 6px;
    font-size: 16px;
    font-weight: 700;
    border: 1px solid #ccc;
    border-radius: 10px;
    background: #fff;
    color: #999;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .title-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .title-btn:disabled {
    opacity: 0.5;
    cursor: default;
  }

  .subtitle {
    text-align: center;
    font-size: 12px;
    color: #aaa;
    margin-top: 8px;
  }
  .probability-line {
    text-align: center;
    font-size: 11px;
    color: #bbb;
    margin-top: 2px;
    margin-bottom: 14px;
  }

  .mode-toggle {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .mode-btn {
    flex: 1;
    padding: 9px 6px;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: #fff;
    color: #666;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .mode-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .mode-btn:disabled {
    opacity: 0.5;
    cursor: default;
  }

  .result-box {
    height: 120px;
    border-radius: 12px;
    background: #fff;
    border: 1px solid #e0e0e0;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 14px;
    transition: background-color 0.05s;
    overflow: hidden;
  }
  .result-placeholder {
    color: #bbb;
    font-size: 14px;
  }
  .result-name {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .spin-btn {
    width: 100%;
    padding: 13px;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s, opacity 0.15s;
  }
  .spin-btn:hover:not(:disabled) { background: var(--accent-hover); }
  .spin-btn:disabled { opacity: 0.5; cursor: default; }

  .status-line {
    text-align: center;
    font-size: 12px;
    color: #888;
    margin-top: 8px;
    min-height: 16px;
  }

  .history-section {
    margin-top: 22px;
  }
  .history-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .history-title { font-size: 12px; color: #888; font-weight: 500; }
  .btn-clear {
    background: none;
    border: 1px solid #ccc;
    color: #888;
    border-radius: 6px;
    font-size: 11px;
    padding: 3px 10px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s;
  }
  .btn-clear:hover { background: #eee; }

  .history-grid {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px;
  }
  .history-chip {
    font-size: 12px;
    font-weight: 500;
    padding: 5px 10px;
    border-radius: 99px;
    border: 1px solid rgba(0,0,0,0.06);
  }
  .history-arrow {
    font-size: 11px;
    color: #ccc;
    padding: 0 1px;
  }
  .history-empty {
    font-size: 12px;
    color: #bbb;
  }

  @media (max-width: 700px) {
    .container { max-width: 100%; }
  }
  @media (max-width: 380px) {
    .title-btn { font-size: 14.5px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="title-toggle">
    <button class="title-btn active" id="title-S">星色ルーレット</button>
    <button class="title-btn" id="title-H">音楽院ルーレット</button>
  </div>
  <div class="subtitle" id="subtitle"></div>
  <div class="probability-line" id="probability-line"></div>

  <div class="mode-toggle">
    <button class="mode-btn active" id="mode-unique">重複なし</button>
    <button class="mode-btn" id="mode-normal">重複あり</button>
  </div>

  <div class="result-box" id="result-box">
    <div class="result-placeholder" id="result-placeholder">ボタンを押して開始</div>
    <div class="result-name" id="result-name" style="display:none;"></div>
  </div>

  <button class="spin-btn" id="spin-btn">ルーレットを回す</button>
  <div class="status-line" id="status-line"></div>

  <div class="history-section">
    <div class="history-header">
      <span class="history-title">履歴</span>
      <button class="btn-clear" id="clear-btn">全消去</button>
    </div>
    <div class="history-grid" id="history-grid">
      <span class="history-empty">まだありません</span>
    </div>
  </div>
</div>

<script>
/* ---- タイトルごとの設定 ---- */
const TITLES = {
  S: {
    label: '星色ルーレット',
    color: '#5BBAF8',
    hover: '#3aa8f0',
    subtitle: 'ステディ全27名+1名(2026年10月9日時点)',
    characters: [
      { name: '氷室蓮',     color: '#7597E1' },
      { name: '白鳥恭治',   color: '#DD91EB' },
      { name: '早乙女天哉', color: '#F7B956' },
      { name: 'シオン',     color: '#65C2E4' },
      { name: '大我',       color: '#DD666C' },
      { name: '桐生隼人',   color: '#505DA1' },
      { name: '月輪るいと', color: '#CE5973' },
      { name: '滝リョーマ', color: '#4B879F' },
      { name: 'アーロン',   color: '#64B79B' },
      { name: '琉青',       color: '#E38E69' },
      { name: '鈴鳴恋詩',   color: '#8D53DB' },
      { name: '浅羽湊輔',   color: '#D5BC62' },
      { name: '黛',         color: '#C8DAB2' },
      { name: '乃楽',       color: '#B25CBF' },
      { name: '東条真夜',   color: '#707861' },
      { name: 'マルコ',     color: '#EFCCC3' },
      { name: '滝マコト',   color: '#FFF552' },
      { name: '森下楓',     color: '#FEDCE8' },
      { name: '鷹美銀',     color: '#F8F5E4' },
      { name: '獏.',        color: '#DEBBFB' },
      { name: 'ひかり',     color: '#FF5360' },
      { name: '四葉レイジ', color: '#355C5C' },
      { name: 'ラヴィ',     color: '#DDE1E2' },
      { name: '四葉ケンゴ', color: '#342F31' },
      { name: '加賀美枕',   color: '#735F68' },
      { name: '阿桜夕陽',   color: '#432045' },
      { name: 'Raita',      color: '#217166' },
      { name: 'まぁくん',   color: '#FFFFFF' },
    ],
  },
  H: {
    label: '音楽院ルーレット',
    color: '#FF88B6',
    hover: '#f070a4',
    subtitle: 'カレ全5名+1名(2026年10月9日時点)',
    characters: [
      { name: '獅堂ケイ',   color: '#BF014E' },
      { name: '漣大和',     color: '#4289BD' },
      { name: '綿谷めぐる', color: '#F5F4F9' },
      { name: '久世幸斗',   color: '#228B22' },
      { name: '柴ムサシ',   color: '#FFE200' },
      { name: 'ポニー',     color: '#FF88B6' },
    ],
  },
};

function getTextColor(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  const luminance = (0.299*r + 0.587*g + 0.114*b) / 255;
  return luminance > 0.6 ? '#1a1a1a' : '#ffffff';
}
Object.values(TITLES).forEach(t => t.characters.forEach(c => { c.text = getTextColor(c.color); }));

/* ---- 状態(履歴はタイトル×重複の有無の4通りで完全に独立) ---- */
const TITLE_KEYS = ['S', 'H'];
const MODE_KEYS = ['normal', 'unique'];
const storageKey = (t, m) => `roulette04_${t}_${m}`;
const TITLE_STORAGE_KEY = 'roulette04_title';

let title = 'S';        // 'S'(星色) | 'H'(音楽院)
let mode = 'unique';    // 'unique'(重複なし) | 'normal'(重複あり)
let histories = {
  S: { normal: [], unique: [] },
  H: { normal: [], unique: [] },
};
let spinning = false;

const resultBox = document.getElementById('result-box');
const placeholder = document.getElementById('result-placeholder');
const resultName = document.getElementById('result-name');
const spinBtn = document.getElementById('spin-btn');
const statusLine = document.getElementById('status-line');
const historyGrid = document.getElementById('history-grid');
const modeNormalBtn = document.getElementById('mode-normal');
const modeUniqueBtn = document.getElementById('mode-unique');
const clearBtn = document.getElementById('clear-btn');
const titleBtns = { S: document.getElementById('title-S'), H: document.getElementById('title-H') };
const subtitleEl = document.getElementById('subtitle');
const probabilityEl = document.getElementById('probability-line');

const currentCharacters = () => TITLES[title].characters;
const currentHistory = () => histories[title][mode];

function loadHistories() {
  TITLE_KEYS.forEach(t => {
    MODE_KEYS.forEach(m => {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey(t, m)) || '[]');
        histories[t][m] = saved
          .map(name => TITLES[t].characters.find(c => c.name === name))
          .filter(Boolean);
      } catch (e) {
        histories[t][m] = [];
      }
    });
  });
}

function saveHistory(t, m) {
  localStorage.setItem(storageKey(t, m), JSON.stringify(histories[t][m].map(c => c.name)));
}

// 重複なしの残りは、そのタイトルの「重複なし」履歴のみを基準に数える
function getRemaining() {
  const h = histories[title].unique;
  return currentCharacters().filter(c => !h.some(x => x.name === c.name));
}

function renderResult(char, isSpinning) {
  placeholder.style.display = 'none';
  resultName.style.display = '';
  resultName.textContent = char.name;
  resultBox.style.background = char.color;
  resultName.style.color = char.text;
  resultBox.style.opacity = isSpinning ? '0.75' : '1';
}

function showPlaceholder() {
  placeholder.style.display = '';
  resultName.style.display = 'none';
  resultBox.style.background = '#fff';
  resultBox.style.opacity = '1';
}

function renderHistory() {
  const h = currentHistory();
  if (h.length === 0) {
    historyGrid.innerHTML = '<span class="history-empty">まだありません</span>';
    return;
  }
  historyGrid.innerHTML = h.map((c, i) => {
    const chip = `<span class="history-chip" style="background:${c.color};color:${c.text};">${c.name}</span>`;
    const arrow = i < h.length - 1 ? '<span class="history-arrow">→</span>' : '';
    return chip + arrow;
  }).join('');
}

function updateStatus() {
  if (mode === 'unique') {
    const remaining = getRemaining();
    if (remaining.length === 0) {
      statusLine.textContent = '全員選出済みです。全消去でリセットできます。';
    } else {
      statusLine.textContent = `一巡するまでひとりずつ抽選します(残り ${remaining.length} 人)`;
    }
  } else {
    statusLine.textContent = '毎回全員から抽選します';
  }
}

// タイトルに応じた見出し・確率表記・配色を反映
function applyTitle() {
  const cfg = TITLES[title];
  const root = document.documentElement;
  root.style.setProperty('--accent', cfg.color);
  root.style.setProperty('--accent-hover', cfg.hover);
  TITLE_KEYS.forEach(t => titleBtns[t].classList.toggle('active', t === title));
  subtitleEl.textContent = cfg.subtitle;
  const n = cfg.characters.length;
  probabilityEl.textContent = `1人あたり 約${(100 / n).toFixed(1)}%(${n}人からひとりを抽選)`;
}

function refreshView() {
  const h = currentHistory();
  if (h.length > 0) {
    renderResult(h[h.length - 1], false);
  } else {
    showPlaceholder();
  }
  renderHistory();
  updateStatus();
}

function switchTitle(newTitle) {
  if (title === newTitle || spinning) return;
  title = newTitle;
  localStorage.setItem(TITLE_STORAGE_KEY, title);
  applyTitle();
  refreshView();
}

// 前回選んでいたタイトルを復元する(未保存・不正な値のときは星色ルーレット)
function loadTitle() {
  const saved = localStorage.getItem(TITLE_STORAGE_KEY);
  title = TITLE_KEYS.includes(saved) ? saved : 'S';
}

function switchMode(newMode) {
  if (mode === newMode || spinning) return;
  mode = newMode;
  modeNormalBtn.classList.toggle('active', mode === 'normal');
  modeUniqueBtn.classList.toggle('active', mode === 'unique');
  refreshView();
}

function setControlsDisabled(disabled) {
  spinBtn.disabled = disabled;
  modeNormalBtn.disabled = disabled;
  modeUniqueBtn.disabled = disabled;
  TITLE_KEYS.forEach(t => { titleBtns[t].disabled = disabled; });
}

// 「全消去」は、いま表示しているタイトル×重複の有無の履歴だけを消す
function resetAll() {
  histories[title][mode] = [];
  saveHistory(title, mode);
  showPlaceholder();
  renderHistory();
  updateStatus();
}

function spin() {
  if (spinning) return;
  const activeTitle = title;
  const activeMode = mode;
  const characters = TITLES[activeTitle].characters;
  const pool = activeMode === 'normal' ? characters : getRemaining();
  if (pool.length === 0) {
    updateStatus();
    return;
  }
  spinning = true;
  setControlsDisabled(true);

  let ticks = 0;
  const maxTicks = 18;
  const timer = setInterval(() => {
    const randChar = characters[Math.floor(Math.random() * characters.length)];
    renderResult(randChar, true);
    ticks++;
    if (ticks >= maxTicks) {
      clearInterval(timer);
      const finalChar = pool[Math.floor(Math.random() * pool.length)];
      renderResult(finalChar, false);
      histories[activeTitle][activeMode].push(finalChar);
      saveHistory(activeTitle, activeMode);
      renderHistory();
      updateStatus();
      spinning = false;
      setControlsDisabled(false);
    }
  }, 55);
}

TITLE_KEYS.forEach(t => titleBtns[t].addEventListener('click', () => switchTitle(t)));
modeNormalBtn.addEventListener('click', () => switchMode('normal'));
modeUniqueBtn.addEventListener('click', () => switchMode('unique'));
spinBtn.addEventListener('click', spin);
clearBtn.addEventListener('click', resetAll);

loadHistories();
loadTitle();
applyTitle();
refreshView();
</script>
</body>
</html>
