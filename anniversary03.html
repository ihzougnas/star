<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>記念日カレンダー</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif;
    background: #f5f5f0;
    color: #1a1a1a;
    padding: 24px 16px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .container { width: 100%; max-width: 780px; }
  h1 { font-size: 19px; font-weight: 700; text-align: center; }
  .subtitle {
    text-align: center;
    font-size: 12px;
    color: #aaa;
    margin-top: 4px;
    margin-bottom: 18px;
  }

  .layout { display: flex; gap: 16px; align-items: flex-start; }
  .col-left { flex: 1; min-width: 0; }
  .col-right { flex: 1; min-width: 0; }

  /* 並び替え */
  .sort-toggle { display: flex; gap: 6px; margin-bottom: 14px; }
  .sort-btn {
    flex: 1;
    padding: 9px 4px;
    font-size: 12.5px;
    font-weight: 500;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: #fff;
    color: #666;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .sort-btn.compact { flex: 0 0 auto; padding: 9px 14px; }
  .sort-btn.active { background: #5BBAF8; color: #fff; border-color: #5BBAF8; }

  .char-list { display: flex; flex-direction: column; gap: 6px; }
  .char-row {
    display: grid;
    grid-template-columns: 18px 1fr 72px 90px;
    align-items: baseline;
    gap: 6px;
    padding: 9px 14px;
    border-radius: 8px;
    font-size: 13px;
  }
  .char-rank { font-size: 11px; opacity: 0.75; }
  .char-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .char-note { font-size: 11px; opacity: 0.7; text-align: right; white-space: nowrap; }
  .char-datecol { font-size: 12px; text-align: right; white-space: nowrap; }

  .today-marker {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; color: #bbb; margin: 2px 0;
  }
  .today-marker::before, .today-marker::after { content: ''; flex: 1; height: 1px; background: #ddd; }

  .empty-message {
    text-align: center;
    font-size: 12.5px;
    color: #aaa;
    padding: 30px 10px;
    border: 1px dashed #ddd;
    border-radius: 10px;
    line-height: 1.8;
  }

  /* 今日の告知 */
  .today-box { border-radius: 12px; overflow: hidden; margin-bottom: 14px; }
  .today-entry {
    padding: 14px 16px; background: #fff; border: 1px solid #e0e0e0; border-left: 6px solid #ccc;
  }
  .today-entry:not(:last-child) { margin-bottom: 8px; }
  .today-congrats { font-size: 11px; color: #999; margin-bottom: 4px; }
  .today-text { font-size: 17px; font-weight: 800; color: #1a1a1a; line-height: 1.4; }

  /* 次の記念日イベント */
  .next-box {
    background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 14px 16px; margin-bottom: 14px;
  }
  .next-main { font-size: 13px; font-weight: 600; color: #333; line-height: 1.7; }
  .next-sub { font-size: 11px; color: #aaa; margin-top: 2px; line-height: 1.6; }
  .name-badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-weight: 700; margin: 0 1px; }
  .badge-sep { color: #ccc; margin: 0 1px; }
  .next-disclaimer { font-size: 10.5px; color: #bbb; margin-top: 12px; line-height: 1.6; }

  /* 今月のカレンダー */
  .month-box { background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
  .month-nav { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 10px; }
  .month-title { font-size: 13px; font-weight: 700; text-align: center; }
  .month-nav-btn {
    width: 24px; height: 24px; border: 1px solid #ccc; border-radius: 6px; background: #fff;
    color: #666; font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .month-nav-btn:hover { background: #eee; }
  .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .month-dow { text-align: center; font-size: 10px; color: #999; padding-bottom: 2px; }
  .month-dow.sun { color: #d44a4a; }
  .month-dow.sat { color: #4a7fd4; }
  .month-day {
    position: relative; aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    font-size: 11px; border-radius: 50%; border: 2px solid transparent;
  }
  .month-day.blank { visibility: hidden; }
  .month-day.marked { cursor: pointer; }
  .day-tip {
    position: absolute; bottom: 115%; left: 50%; transform: translateX(-50%);
    background: #1a1a1a; color: #fff; font-size: 10px; padding: 3px 7px; border-radius: 6px;
    white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.12s; z-index: 5;
  }
  .month-day.marked:hover .day-tip, .month-day.show-tip .day-tip { opacity: 1; }

  /* 登録フォーム */
  .register-form {
    background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .form-label { font-size: 12px; color: #888; font-weight: 500; }
  .reg-select {
    width: 100%; padding: 9px 10px; font-size: 13px; border: 1px solid #ccc; border-radius: 8px;
    font-family: inherit; background: #fff; color: #1a1a1a;
  }
  .reg-date-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .reg-date-part {
    width: 56px; padding: 9px 6px; font-size: 13px; text-align: center;
    border: 1px solid #ccc; border-radius: 8px; font-family: inherit; color: #1a1a1a;
  }
  .reg-date-part.year { width: 70px; }
  .reg-date-sep { color: #999; font-size: 13px; }

  .combo-wrap { position: relative; }
  .combo-panel {
    display: none;
    position: absolute;
    top: 100%; left: 0;
    margin-top: 4px;
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    z-index: 20;
    min-width: 64px;
  }
  .combo-panel.open { display: block; }
  .combo-panel.scrollable { max-height: 384px; overflow-y: auto; }
  .combo-option {
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    cursor: pointer;
  }
  .combo-option:hover { background: #f0f7ff; }
  .small-btn {
    padding: 8px 12px; font-size: 12.5px; font-weight: 500; border: 1px solid #ccc; border-radius: 8px;
    background: #fff; color: #555; cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  .small-btn:hover { background: #eee; }
  .submit-btn {
    padding: 11px; font-size: 14px; font-weight: 700; border: none; border-radius: 8px;
    background: #5BBAF8; color: #fff; cursor: pointer; font-family: inherit;
  }
  .submit-btn:hover { background: #3aa8f0; }
  .reg-status { font-size: 12px; min-height: 16px; }
  .reg-status.ok { color: #2a8f4f; }
  .reg-status.err { color: #c0392b; }

  /* 保存・読込・リセット */
  .data-box { background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 14px 16px; }
  .data-section { margin-bottom: 14px; }
  .data-section:last-of-type { margin-bottom: 10px; }
  .data-label { font-size: 12px; color: #888; margin-bottom: 6px; }
  .data-row { display: flex; gap: 6px; align-items: stretch; }
  .data-box textarea {
    flex: 1;
    min-width: 0;
    font-size: 11.5px; font-family: monospace; padding: 8px; border: 1px solid #ccc;
    border-radius: 8px; resize: vertical; color: #1a1a1a;
  }
  .data-row > .small-btn { flex-shrink: 0; }
  .data-btn-col { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
  .data-btn-col .small-btn { flex: 1; }
  .reset-btn {
    width: 100%; padding: 9px; font-size: 13px; font-weight: 600; border: 1px solid #e0a0a0;
    border-radius: 8px; background: #fff5f5; color: #c0392b; cursor: pointer; font-family: inherit;
  }
  .reset-btn:hover { background: #ffe8e8; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #1a1a1a; color: #fff; font-size: 13px; padding: 7px 18px; border-radius: 99px;
    opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 10;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 700px) {
    .layout { flex-direction: column; }
    .col-right { order: -1; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>記念日カレンダー</h1>
  <div class="subtitle">全ステディ27名+全カレ5名対応(2026年10月3日時点)</div>

  <div class="layout">
    <div class="col-left">
      <div class="sort-toggle">
        <button class="sort-btn active" data-mode="start">交際日順</button>
        <button class="sort-btn" data-mode="anniv">記念日順</button>
        <button class="sort-btn" data-mode="event">イベント順</button>
        <button class="sort-btn compact" data-mode="register">登録/保存</button>
      </div>
      <div id="list-area"></div>
    </div>

    <div class="col-right">
      <div class="today-box" id="today-box"></div>
      <div class="next-box" id="next-box"></div>
      <div class="month-box">
        <div class="month-nav">
          <button class="month-nav-btn" id="month-prev" aria-label="前月">&lt;</button>
          <div class="month-title" id="month-title"></div>
          <button class="month-nav-btn" id="month-next" aria-label="翌月">&gt;</button>
        </div>
        <div class="month-grid" id="month-grid"></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---- マスターデータ(星色ステディ27名 + ハートビート音楽院5名) ---- */
const ALL_CHARACTERS = [
  { pool: 'S', idx: 1,  name: '氷室蓮',     color: '#7597E1' },
  { pool: 'S', idx: 2,  name: '白鳥恭治',   color: '#DD91EB' },
  { pool: 'S', idx: 3,  name: '早乙女天哉', color: '#F7B956' },
  { pool: 'S', idx: 4,  name: 'シオン',     color: '#65C2E4' },
  { pool: 'S', idx: 5,  name: '大我',       color: '#DD666C' },
  { pool: 'S', idx: 6,  name: '桐生隼人',   color: '#505DA1' },
  { pool: 'S', idx: 7,  name: '月輪るいと', color: '#CE5973' },
  { pool: 'S', idx: 8,  name: '滝リョーマ', color: '#4B879F' },
  { pool: 'S', idx: 9,  name: 'アーロン',   color: '#64B79B' },
  { pool: 'S', idx: 10, name: '琉青',       color: '#E38E69' },
  { pool: 'S', idx: 11, name: '鈴鳴恋詩',   color: '#8D53DB' },
  { pool: 'S', idx: 12, name: '浅羽湊輔',   color: '#D5BC62' },
  { pool: 'S', idx: 13, name: '黛',         color: '#C8DAB2' },
  { pool: 'S', idx: 14, name: '乃楽',       color: '#B25CBF' },
  { pool: 'S', idx: 15, name: '東条真夜',   color: '#707861' },
  { pool: 'S', idx: 16, name: 'マルコ',     color: '#EFCCC3' },
  { pool: 'S', idx: 17, name: '滝マコト',   color: '#FFF552' },
  { pool: 'S', idx: 18, name: '森下楓',     color: '#FEDCE8' },
  { pool: 'S', idx: 19, name: '鷹美銀',     color: '#F8F5E4' },
  { pool: 'S', idx: 20, name: '獏.',        color: '#DEBBFB' },
  { pool: 'S', idx: 21, name: 'ひかり',     color: '#FF5360' },
  { pool: 'S', idx: 22, name: '四葉レイジ', color: '#355C5C' },
  { pool: 'S', idx: 23, name: 'ラヴィ',     color: '#DDE1E2' },
  { pool: 'S', idx: 24, name: '四葉ケンゴ', color: '#342F31' },
  { pool: 'S', idx: 25, name: '加賀美枕',   color: '#735F68' },
  { pool: 'S', idx: 26, name: '阿桜夕陽',   color: '#432045' },
  { pool: 'S', idx: 27, name: 'Raita',      color: '#217166' },
  { pool: 'H', idx: 1,  name: '獅堂ケイ',   color: '#BF014E' },
  { pool: 'H', idx: 2,  name: '漣大和',     color: '#4289BD' },
  { pool: 'H', idx: 3,  name: '綿谷めぐる', color: '#F5F4F9' },
  { pool: 'H', idx: 4,  name: '久世幸斗',   color: '#228B22' },
  { pool: 'H', idx: 5,  name: '柴ムサシ',   color: '#FFE200' },
];
const ALL_CHAR_MAP = {};
ALL_CHARACTERS.forEach(c => { c.code = c.pool + c.idx; ALL_CHAR_MAP[c.code] = c; });

function getTextColor(hex) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const luminance = (0.299*r + 0.587*g + 0.114*b) / 255;
  return luminance > 0.6 ? '#1a1a1a' : '#ffffff';
}
function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}
ALL_CHARACTERS.forEach(c => { c.text = getTextColor(c.color); });

const today = new Date(); today.setHours(0,0,0,0);
const todayY = today.getFullYear(), todayM = today.getMonth()+1, todayD = today.getDate();
const MSDAY = 86400000;
function diffDays(date) { return Math.round((date - today) / MSDAY); }

/* ---- 登録データ(永続化・符号化) ---- */
const STORAGE_KEY = 'anniversary02_registrations';
let registrations = []; // [{code, start:[y,m,d]}]
let COUPLES = [];

function pad2(n) { return String(n).padStart(2,'0'); }
function encodeSave() {
  return registrations.map(r => `${r.code}-${r.start[0]}${pad2(r.start[1])}${pad2(r.start[2])}`).join(',');
}
function decodeSave(str) {
  const tokens = str.trim().split(/[,\s]+/).filter(Boolean);
  const out = [];
  const seen = new Set();
  tokens.forEach(t => {
    const m = t.match(/^([SH])(\d+)-(\d{4})(\d{2})(\d{2})$/);
    if (!m) return;
    const code = m[1] + Number(m[2]);
    if (!ALL_CHAR_MAP[code] || seen.has(code)) return;
    seen.add(code);
    out.push({ code, start: [Number(m[3]), Number(m[4]), Number(m[5])] });
  });
  return out;
}
function saveRegistrations() {
  localStorage.setItem(STORAGE_KEY, encodeSave());
}
function loadRegistrations() {
  const saved = localStorage.getItem(STORAGE_KEY) || '';
  registrations = saved ? decodeSave(saved) : [];
}
function rebuildCouples() {
  COUPLES = registrations.map(r => {
    const c = ALL_CHAR_MAP[r.code];
    return { name: c.name, color: c.color, text: c.text, start: r.start, code: r.code };
  });
}

let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1500);
}

/* ---- 記念日イベント(1,3,6ヶ月→以降半年ごと) ---- */
function milestoneMonthsList(maxMonths) {
  const list = [1,3];
  for (let m = 6; m <= maxMonths; m += 6) list.push(m);
  return list;
}
function addMonths(dateYMD, months) {
  const [y,m,d] = dateYMD;
  return new Date(y, m-1+months, d);
}
function milestoneLabel(months) {
  if (months < 12) return `${months}ヶ月`;
  if (months % 12 === 0) return `${months/12}年`;
  return `${Math.floor(months/12)}年${months%12}ヶ月`;
}
function nextMilestoneStrict(start) {
  const months = milestoneMonthsList(600);
  for (const mo of months) {
    const d = addMonths(start, mo);
    if (d > today) return { date: d, months: mo };
  }
  return null;
}
function lastHeldMilestone(start) {
  const months = milestoneMonthsList(600);
  let held = null;
  for (const mo of months) {
    const d = addMonths(start, mo);
    if (d <= today) held = { mo, date: d }; else break;
  }
  return held;
}

/* ---- 今日の告知 ---- */
function renderTodayBox() {
  const box = document.getElementById('today-box');
  const todays = [];
  COUPLES.forEach(c => {
    const months = milestoneMonthsList(600);
    for (const mo of months) {
      const d = addMonths(c.start, mo);
      if (d.getTime() === today.getTime()) {
        todays.push({ text: `${c.name}さんとの交際${milestoneLabel(mo)}記念日イベントが開催中です`, color: c.color, sortYear: c.start[0] });
        break;
      }
      if (d > today) break;
    }
  });
  todays.sort((a,b) => a.sortYear - b.sortYear);
  if (todays.length === 0) { box.style.display = 'none'; box.innerHTML = ''; return; }
  box.style.display = '';
  box.innerHTML = todays.map(t => `
    <div class="today-entry" style="border-left-color:${t.color};">
      <div class="today-congrats">おめでとうございます🎉</div>
      <div class="today-text">${t.text}</div>
    </div>
  `).join('');
}

/* ---- 次の記念日イベント(お知らせ) ---- */
function badgeHtml(item) {
  return `<span class="name-badge" style="background:${item.color};color:${item.text};">${item.name}</span>`;
}
function renderNextBox() {
  const box = document.getElementById('next-box');
  const disclaimer = '<div class="next-disclaimer">※記念日イベントはステディ・カレによって実装時期が異なるため、予告通りの開催とはならない場合があります。</div>';
  if (COUPLES.length === 0) {
    box.innerHTML = '<div class="next-sub">登録された記念日がありません。</div>' + disclaimer;
    return;
  }
  const items = COUPLES.map(c => {
    const nm = nextMilestoneStrict(c.start);
    return { name: c.name, color: c.color, text: c.text, date: nm.date, months: nm.months };
  });
  const byDate = {};
  items.forEach(it => { const key = it.date.getTime(); (byDate[key] = byDate[key] || []).push(it); });
  const groups = Object.entries(byDate)
    .map(([key, arr]) => ({ date: new Date(Number(key)), items: arr }))
    .sort((a,b) => a.date - b.date);

  function line(group, isMain) {
    if (!group) return '';
    const d = diffDays(group.date);
    const md = `${group.date.getMonth()+1}月${group.date.getDate()}日`;
    const names = group.items.map(badgeHtml).join('<span class="badge-sep">・</span>');
    const label = group.items.length === 1 ? `交際${milestoneLabel(group.items[0].months)}` : '';
    const cls = isMain ? 'next-main' : 'next-sub';
    const prefix = isMain ? '次の記念日イベントは' : '';
    return `<div class="${cls}">${prefix}${names} ${label}<br>${md}まであと${d}日</div>`;
  }
  box.innerHTML = line(groups[0], true) + line(groups[1], false) + line(groups[2], false) + disclaimer;
}

/* ---- リスト(交際日順・記念日順・イベント順) ---- */
function sortedList(mode) {
  if (mode === 'event') {
    return [...COUPLES].sort((a,b) => nextMilestoneStrict(a.start).date - nextMilestoneStrict(b.start).date);
  }
  const list = [...COUPLES];
  if (mode === 'start') {
    list.sort((a,b) => a.start[0]-b.start[0] || a.start[1]-b.start[1] || a.start[2]-b.start[2]);
  } else {
    list.sort((a,b) => a.start[1]-b.start[1] || a.start[2]-b.start[2] || a.start[0]-b.start[0]);
  }
  return list;
}
function daysUntilNext(m, d) {
  let cand = new Date(todayY, m-1, d);
  if (cand < today) cand = new Date(todayY+1, m-1, d);
  return diffDays(cand);
}
function rowInfo(c, mode) {
  if (mode === 'start') {
    const since = -diffDays(new Date(c.start[0], c.start[1]-1, c.start[2]));
    return { note: `${since}日前`, date: `${c.start[0]}年${c.start[1]}月${c.start[2]}日` };
  }
  if (mode === 'anniv') {
    const until = daysUntilNext(c.start[1], c.start[2]);
    return { note: `あと${until}日`, date: `${c.start[1]}月${c.start[2]}日` };
  }
  const held = lastHeldMilestone(c.start);
  const note = held ? `${milestoneLabel(held.mo)}${held.date.getTime() === today.getTime() ? '開催中' : '開催済'}` : '';
  const nm = nextMilestoneStrict(c.start);
  return { note, date: `あと${diffDays(nm.date)}日` };
}

const EMPTY_MSG = '<div class="empty-message">まだ何も登録されていません。<br>「登録」タブから交際開始日を登録してください。</div>';

function renderList(mode) {
  const wrap = document.getElementById('list-area');
  if (COUPLES.length === 0) { wrap.innerHTML = EMPTY_MSG; return; }

  const list = sortedList(mode);
  const rows = list.map((c, i) => {
    const info = rowInfo(c, mode);
    return `
    <div class="char-row" style="background:${c.color};color:${c.text};">
      <span class="char-rank">${i+1}</span>
      <span class="char-name">${c.name}</span>
      <span class="char-note">${info.note}</span>
      <span class="char-datecol">${info.date}</span>
    </div>
  `;
  });

  if (mode === 'anniv') {
    let insertAt = list.length;
    for (let i = 0; i < list.length; i++) {
      const m = list[i].start[1], d = list[i].start[2];
      if (m > todayM || (m === todayM && d >= todayD)) { insertAt = i; break; }
    }
    rows.splice(insertAt, 0, '<div class="today-marker">今日</div>');
  }
  wrap.innerHTML = `<div class="char-list">${rows.join('')}</div>`;
}

/* ---- 登録フォーム ---- */
function renderRegisterForm() {
  const wrap = document.getElementById('list-area');
  const registeredCodes = new Set(registrations.map(r => r.code));
  const sPool = ALL_CHARACTERS.filter(c => c.pool === 'S' && !registeredCodes.has(c.code));
  const hPool = ALL_CHARACTERS.filter(c => c.pool === 'H' && !registeredCodes.has(c.code));

  const optionsHtml = (list) => list.map(c => `<option value="${c.code}">${c.name}</option>`).join('');

  wrap.innerHTML = `
    <div class="register-form">
      <div>
        <div class="form-label">ステディ・カレを選択</div>
        <select class="reg-select" id="reg-char">
          <option value="" disabled selected>選択してください</option>
          ${sPool.length ? `<optgroup label="星色ステディ">${optionsHtml(sPool)}</optgroup>` : ''}
          ${hPool.length ? `<optgroup label="ハートビート音楽院">${optionsHtml(hPool)}</optgroup>` : ''}
        </select>
      </div>
      <div>
        <div class="form-label">交際開始日を選択</div>
        <div class="reg-date-row">
          <div class="combo-wrap">
            <input type="text" inputmode="numeric" placeholder="年" class="reg-date-part year" id="reg-year" maxlength="4" autocomplete="off">
            <div class="combo-panel" id="year-panel"></div>
          </div>
          <span class="reg-date-sep">/</span>
          <div class="combo-wrap">
            <input type="text" inputmode="numeric" placeholder="月" class="reg-date-part" id="reg-month" maxlength="2" autocomplete="off">
            <div class="combo-panel" id="month-panel"></div>
          </div>
          <span class="reg-date-sep">/</span>
          <div class="combo-wrap">
            <input type="text" inputmode="numeric" placeholder="日" class="reg-date-part" id="reg-day" maxlength="2" autocomplete="off">
            <div class="combo-panel scrollable" id="day-panel"></div>
          </div>
        </div>
      </div>
      <button type="button" class="submit-btn" id="reg-submit-btn">登録する</button>
      <div class="reg-status" id="reg-status"></div>

      <div class="data-box">
        <div class="data-section">
          <div class="data-label">保存用コード(コピーして控えてください)</div>
          <div class="data-row">
            <textarea id="export-text" rows="2" readonly></textarea>
            <button class="small-btn" id="copy-btn">コピー</button>
          </div>
        </div>
        <div class="data-section">
          <div class="data-label">保存用コードを読み込む</div>
          <div class="data-row">
            <textarea id="import-text" rows="2" placeholder="保存用コードを貼り付け"></textarea>
            <div class="data-btn-col">
              <button class="small-btn" id="paste-btn">貼付</button>
              <button class="small-btn" id="import-btn">読込</button>
            </div>
          </div>
        </div>
        <button class="reset-btn" id="reset-btn">すべてリセット</button>
      </div>
    </div>
  `;

  if (sPool.length === 0 && hPool.length === 0) {
    document.getElementById('reg-char').disabled = true;
    document.getElementById('reg-submit-btn').disabled = true;
    document.getElementById('reg-status').textContent = '全キャラクターが登録済みです。';
  }

  const yearEl = document.getElementById('reg-year');
  const monthEl = document.getElementById('reg-month');
  const dayEl = document.getElementById('reg-day');

  const yearPanel = document.getElementById('year-panel');
  const monthPanel = document.getElementById('month-panel');
  const dayPanel = document.getElementById('day-panel');

  function closeAllPanels() {
    [yearPanel, monthPanel, dayPanel].forEach(p => p.classList.remove('open'));
  }
  function buildPanel(panel, values, onPick) {
    panel.innerHTML = values.map(v => `<div class="combo-option">${v}</div>`).join('');
    panel.querySelectorAll('.combo-option').forEach((opt, i) => {
      opt.addEventListener('mousedown', (e) => {
        e.preventDefault(); // inputのblurより先に発火させ、値を確実に反映する
        onPick(values[i]);
        closeAllPanels();
      });
    });
  }

  // 年・月は全件を常に表示(スクロールなし)。年は今後候補が増えても高さが伸びるだけで全件表示を維持する。
  const yearValues = [];
  for (let y = todayY + 1; y >= 2023; y--) yearValues.push(String(y));
  buildPanel(yearPanel, yearValues, (v) => { yearEl.value = v; updateDayOptions(); monthEl.focus(); });

  const monthValues = [];
  for (let m = 1; m <= 12; m++) monthValues.push(pad2(m));
  buildPanel(monthPanel, monthValues, (v) => { monthEl.value = v; updateDayOptions(); dayEl.focus(); });

  // 日は年・月に応じた実日数までを表示。月パネルと同じ高さ(12件分)まではスクロールなしで見え、
  // それ以降はスクロールで表示する。
  function updateDayOptions() {
    let maxDay = 31;
    if (monthEl.value) {
      const m = Number(monthEl.value);
      const y = yearEl.value ? Number(yearEl.value) : 2001; // 年未入力時は平年扱いで控えめに
      maxDay = new Date(y, m, 0).getDate();
    }
    const dayValues = [];
    for (let d = 1; d <= maxDay; d++) dayValues.push(pad2(d));
    buildPanel(dayPanel, dayValues, (v) => { dayEl.value = v; closeAllPanels(); });
    if (dayEl.value && Number(dayEl.value) > maxDay) dayEl.value = '';
  }
  updateDayOptions();

  // 年が4桁、月日が2桁に達したら自動的に次の欄へ進む(直接入力時)
  yearEl.addEventListener('input', () => {
    yearEl.value = yearEl.value.replace(/\D/g, '').slice(0, 4);
    if (yearEl.value.length === 4) monthEl.focus();
    updateDayOptions();
  });
  monthEl.addEventListener('input', () => {
    monthEl.value = monthEl.value.replace(/\D/g, '').slice(0, 2);
    if (monthEl.value.length === 2) dayEl.focus();
    updateDayOptions();
  });
  dayEl.addEventListener('input', () => {
    dayEl.value = dayEl.value.replace(/\D/g, '').slice(0, 2);
  });

  // フォーカスでパネルを開く(タップ/クリックでの選び直しが常に全件からできる)
  yearEl.addEventListener('focus', () => { closeAllPanels(); yearPanel.classList.add('open'); });
  monthEl.addEventListener('focus', () => { closeAllPanels(); monthPanel.classList.add('open'); });
  dayEl.addEventListener('focus', () => { closeAllPanels(); dayPanel.classList.add('open'); });
  document.addEventListener('mousedown', (e) => {
    if (!e.target.closest('.combo-wrap')) closeAllPanels();
  });

  /* ---- 保存・読込・リセット(登録タブ内に配置) ---- */
  function refreshExportText() {
    const el = document.getElementById('export-text');
    if (el) el.value = encodeSave();
  }
  refreshExportText();
  document.getElementById('copy-btn').addEventListener('click', () => {
    const text = document.getElementById('export-text').value;
    if (!text) { showToast('登録がありません'); return; }
    navigator.clipboard.writeText(text).then(() => showToast('コピーしました'));
  });
  document.getElementById('paste-btn').addEventListener('click', () => {
    navigator.clipboard.readText().then(text => {
      document.getElementById('import-text').value = text;
    }).catch(() => showToast('クリップボードを読み取れませんでした'));
  });
  document.getElementById('import-btn').addEventListener('click', () => {
    const raw = document.getElementById('import-text').value;
    if (!raw.trim()) { showToast('コードを入力してください'); return; }
    if (registrations.length > 0) {
      if (!confirm('現在の登録内容を、読み込んだコードの内容で置き換えます。よろしいですか？')) return;
    }
    const decoded = decodeSave(raw);
    registrations = decoded;
    saveRegistrations();
    rebuildCouples();
    refreshAll();
    showToast(`${decoded.length}件読み込みました`);
  });
  document.getElementById('reset-btn').addEventListener('click', () => {
    if (!confirm('登録されているすべての記念日データを削除します。よろしいですか？この操作は元に戻せません。')) return;
    registrations = [];
    saveRegistrations();
    rebuildCouples();
    refreshAll();
    showToast('リセットしました');
  });

  document.getElementById('reg-submit-btn').addEventListener('click', () => {
    const code = document.getElementById('reg-char').value;
    const y = Number(yearEl.value), m = Number(monthEl.value), d = Number(dayEl.value);
    const statusEl = document.getElementById('reg-status');
    if (!code) { statusEl.className = 'reg-status err'; statusEl.textContent = 'キャラクターを選択してください。'; return; }
    if (!y || !m || !d || m < 1 || m > 12 || d < 1 || d > new Date(y, m, 0).getDate()) {
      statusEl.className = 'reg-status err'; statusEl.textContent = '存在する交際開始日を正しく入力してください。'; return;
    }
    if (registrations.some(r => r.code === code)) {
      statusEl.className = 'reg-status err'; statusEl.textContent = 'このキャラクターは既に登録されています。'; return;
    }
    registrations.push({ code, start: [y,m,d] });
    saveRegistrations();
    rebuildCouples();
    refreshAll();
    const name = ALL_CHAR_MAP[code].name;
    renderRegisterForm();
    document.getElementById('reg-status').className = 'reg-status ok';
    document.getElementById('reg-status').textContent = `${name}を登録しました。`;
  });
}

/* ---- 今月のカレンダー ---- */
let viewYear = todayY, viewMonth = todayM;
function renderMonthCalendar() {
  document.getElementById('month-title').textContent = `${viewYear}年${viewMonth}月`;
  const dowWrap = document.getElementById('month-grid');
  const DOW = ['日','月','火','水','木','金','土'];
  const daysInMonth = new Date(viewYear, viewMonth, 0).getDate();
  const startDow = new Date(viewYear, viewMonth-1, 1).getDay();

  const dayInfo = {};
  COUPLES.forEach(c => { (dayInfo[c.start[2]] = dayInfo[c.start[2]] || []).push(c); });
  Object.values(dayInfo).forEach(arr => arr.sort((a,b) => a.start[0]-b.start[0] || a.start[1]-b.start[1] || a.start[2]-b.start[2]));

  let html = DOW.map((l,i) => `<div class="month-dow${i===0?' sun':i===6?' sat':''}">${l}</div>`).join('');
  for (let i = 0; i < startDow; i++) html += '<div class="month-day blank"></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const matches = dayInfo[d];
    if (!matches) { html += `<div class="month-day">${d}</div>`; continue; }
    const color = matches[0].color;
    const tipLines = matches.map(c => `<div>${c.name}</div>`).join('');
    const style = `border-color:${color};background:${hexToRgba(color,0.2)};`;
    html += `<div class="month-day marked" style="${style}" data-day="${d}">${d}<span class="day-tip">${tipLines}</span></div>`;
  }
  dowWrap.innerHTML = html;

  dowWrap.querySelectorAll('.month-day.marked').forEach(cell => {
    const matches = dayInfo[cell.dataset.day];
    if (matches.length <= 1) {
      cell.addEventListener('click', () => {
        const wasShown = cell.classList.contains('show-tip');
        dowWrap.querySelectorAll('.month-day.show-tip').forEach(el => el.classList.remove('show-tip'));
        if (!wasShown) cell.classList.add('show-tip');
      });
      return;
    }
    cell._cycleIndex = 0;
    cell.addEventListener('click', () => {
      cell._cycleIndex = (cell._cycleIndex + 1) % matches.length;
      const current = matches[cell._cycleIndex];
      cell.style.borderColor = current.color;
      cell.style.background = hexToRgba(current.color, 0.2);
    });
  });
}
document.getElementById('month-prev').addEventListener('click', () => {
  viewMonth--; if (viewMonth < 1) { viewMonth = 12; viewYear--; }
  renderMonthCalendar();
});
document.getElementById('month-next').addEventListener('click', () => {
  viewMonth++; if (viewMonth > 12) { viewMonth = 1; viewYear++; }
  renderMonthCalendar();
});

/* ---- 全体再描画 ---- */
let currentMode = 'start';
function refreshAll() {
  renderTodayBox();
  renderNextBox();
  renderMonthCalendar();
  if (currentMode === 'register') renderRegisterForm();
  else renderList(currentMode);
}

document.querySelectorAll('.sort-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentMode = btn.dataset.mode;
    if (currentMode === 'register') renderRegisterForm();
    else renderList(currentMode);
  });
});

loadRegistrations();
rebuildCouples();
refreshAll();
</script>
